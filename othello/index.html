    if (!lease.acquired){ netMsg('その数字は今ほかの人が使っています。別の4桁にしてください。'); return; }
    const s=await ref.get();
    const d=s.exists ? s.data() : null;
    const live = d && Date.now()-(d.updated||0) < STALE_MS && !d.over;
    if (live && d.seats && d.seats[1] && d.seats[1]!==ME){ netMsg('その数字の部屋はいま対戦中です。別の4桁にしてください。'); return; }
    const S=freshState();
    net.seq=(d && d.seq || 0)+1;
    await ref.set(roomDoc(S,{1:ME,2:''}));
    Object.assign(net,{kind:'db',ref,code,side:1,opp:false,queue:[]});
    enterHostDraft(); resetLocal(S); attachDb();
  } catch(e){ netMsg('部屋を作れませんでした。少し待ってからもう一度試してください。'); }
}
async function joinDb(code, pref){
  const db=await prepareDb(); if(!db) return;
  netMsg('部屋を探しています…');
  try {
    const ref=db.doc('games/'+code);
    const s=await ref.get();
    if (!s.exists){ netMsg(`合言葉 <strong>${code}</strong> の部屋が見つかりません。相手が先に「部屋を作る」を押したか確かめてください。`); return; }
    const lease=await ref.acquire({holder:ME,ttlMs:4000});
    if (!lease.acquired){ netMsg('ほかの人が同時に入ろうとしています。数秒後にもう一度試してください。'); return; }
    const d=(await ref.get()).data();
    if (!validDoc(d)){ netMsg('この部屋のデータが壊れています。相手に部屋を作り直してもらってください。'); return; }
    const seats=d.seats||{}, fresh=Date.now()-(d.updated||0) < STALE_MS;
    let side;
    if (pref && (!seats[pref] || seats[pref]===ME || !fresh)) side=pref;
    else if (seats[1]===ME) side=1;
    else if (seats[2]===ME || !seats[2] || !fresh) side=2;
    else { netMsg('この部屋はもう2人そろっています。'); return; }
    await ref.update({seats:{[side]:ME}, names:{[side]:myName()}, updated:Date.now()});
    Object.assign(net,{kind:'db',ref,code,side,opp:false,queue:[],seq:d.seq||0});
    d.burns=d.burns||[]; d.guards=d.guards||[]; d.used=d.used||{1:0,2:0}; d.pas=d.pas||freshPas(); d.ev=[];
    phase=''; syncPhase(d); resetLocal(d); attachDb();
  } catch(e){ netMsg('部屋に入れませんでした。少し待ってからもう一度試してください。'); }
}
function attachDb(){
  paintOnline(); paintNetStatus(); render(); announceName();
  net.unsub=net.ref.onSnapshot(s=>{
    if (!s.exists){ netMsg('部屋が見つからなくなりました。もう一度作り直してください。'); return; }
    onNet(s.data());
  }, ()=>{ netMsg('通信が切れました。「退出」してから、もう一度同じ数字で部屋に入ってください。'); });
}

/* p2p transport (normal websites) */
let peerLoad=null;
function loadPeer(){
  if (window.Peer) return Promise.resolve(true);
  if (!peerLoad) peerLoad=new Promise(res=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload=()=>res(!!window.Peer); s.onerror=()=>{ peerLoad=null; res(false); };
    document.head.appendChild(s);
  });
  return peerLoad;
}
function cleanupPeer(){
  clearTimeout(net.retryT); clearTimeout(net.joinT);
  try { net.conn && net.conn.close(); } catch(e){}
  try { net.peer && net.peer.destroy(); } catch(e){}
  net.conn=null; net.peer=null;
  paintOnline();
}
async function hostP2P(code, restore, tries=0){
  netMsg(restore ? '対戦に戻っています…' : '部屋を準備しています…');
  if (!await loadPeer()){ netMsg('通信の準備ができませんでした。インターネット接続を確かめてください。'); return; }
  const peer=new Peer(PEER_PREFIX+code); net.peer=peer; paintOnline();
  peer.on('open',()=>{
    if (restore && validDoc(restore)){
      const d=clone(restore); d.burns=d.burns||[]; d.guards=d.guards||[]; d.used=d.used||{1:0,2:0}; d.pas=d.pas||freshPas(); d.ev=[];
      net.shared=clone(d); net.shared.seats={1:ME,2:''}; net.shared.names={...(d.names||{}),1:myName()};
      Object.assign(net,{kind:'p2p',code,side:1,opp:false,queue:[],seq:d.seq||0});
      phase=''; syncPhase(d); resetLocal(d); onNet(net.shared); paintOnline(); paintNetStatus(); render();
      return;
    }
    const S=freshState();
    net.seq=1;
    net.shared=roomDoc(S,{1:ME,2:''});
    Object.assign(net,{kind:'p2p',code,side:1,opp:false,queue:[]});
    enterHostDraft(); resetLocal(S); paintOnline(); paintNetStatus(); render();
  });
  peer.on('connection',conn=>{
    conn.on('data',msg=>{
      if (!msg || typeof msg!=='object' || !net.shared) return;
      if (msg.t==='hello'){
        const who=String(msg.me||'guest').slice(0,40);
        // a closed tab can look connected for a while: the same guest coming back replaces it, anyone else is turned away
        const other = net.conn && net.conn!==conn && net.conn.open;
        if ((other && who!==net.shared.guest) || (net.shared.phase==='play' && net.shared.guest && net.shared.guest!==who)){ conn.send({t:'full'}); setTimeout(()=>conn.close(),500); return; }
        if (other){ const old=net.conn; net.conn=conn; try { old.close(); } catch(e){} }
        net.conn=conn;
        deepMerge(net.shared,{seats:{2:who}, guest:who, names:{2:cleanName(msg.name)}, updated:Date.now()});
        conn.send({t:'state', d:net.shared});
        onNet(net.shared);
      } else if (msg.t==='patch' && net.conn===conn && msg.p && typeof msg.p==='object'){
        deepMerge(net.shared,msg.p); onNet(net.shared);
      }
    });
    conn.on('close',()=>{ if (net.conn===conn){ net.conn=null; if (net.shared){ net.shared.seats[2]=''; onNet(net.shared); } } });
  });
  peer.on('disconnected',()=>{ try { if (!peer.destroyed) peer.reconnect(); } catch(e){} });
  peer.on('error',e=>{
    if (e.type==='unavailable-id' && restore && tries<12){
      // the old connection takes a few seconds to be released
      cleanupPeer(); netMsg(`前の接続が切れるのを待っています…（${tries+1}/12）`);
      net.retryT=setTimeout(()=>hostP2P(code,restore,tries+1),3000);
    }
    else if (e.type==='unavailable-id'){ netMsg('その数字の部屋はいま使われています。別の4桁にしてください。'); cleanupPeer(); }
    else if (!net.kind){ netMsg(`接続できませんでした（${e.type}）。少し待ってからもう一度試してください。`); cleanupPeer(); }
  });
}
async function joinP2P(code, saved){
  netMsg(saved ? '対戦に戻っています…' : '部屋を探しています…');
  if (!await loadPeer()){ netMsg('通信の準備ができませんでした。インターネット接続を確かめてください。'); return; }
  const peer=new Peer(); net.peer=peer; net.pending={code, saved:saved||null}; net.tries=0; paintOnline();
  peer.on('open',()=>guestConnect());
  peer.on('disconnected',()=>{ try { if (!peer.destroyed) peer.reconnect(); } catch(e){} });
  peer.on('error',e=>{
    if (net.peer!==peer) return;
    if (e.type==='peer-unavailable' || net.kind || (net.pending && net.pending.saved)){ clearTimeout(net.joinT); retryGuest(e.type); }
    else { clearTimeout(net.joinT); netMsg(`接続できませんでした（${e.type}）。少し待ってからもう一度試してください。`); cleanupPeer(); }
  });
}
function guestConnect(){
  const pd=net.pending, peer=net.peer; if (!pd || !peer || peer.destroyed) return;
  const conn=peer.connect(PEER_PREFIX+pd.code,{reliable:true}); net.conn=conn;
  clearTimeout(net.joinT);
  net.joinT=setTimeout(()=>{ if (net.conn===conn && !conn.open) retryGuest('timeout'); },10000);
  conn.on('open',()=>{ clearTimeout(net.joinT); net.tries=0; const mine=net.shared||pd.saved; conn.send({t:'hello',me:ME,name:myName(),seq:(mine&&mine.seq)||0}); });
  conn.on('data',msg=>{
    if (!msg || typeof msg!=='object' || net.conn!==conn) return;
    if (msg.t==='full'){ net.pending=null; netMsg('この部屋はもう2人そろっています。'); cleanupPeer(); return; }
    if (msg.t==='state' && validDoc(msg.d)){
      let d=clone(msg.d);
      // if this side saw more of the game than the host kept, hand our copy back
      const mine=net.shared||pd.saved;
      if (mine && validDoc(mine) && (mine.seq||0)>(d.seq||0) && mine.phase==='play'){ d={...clone(mine), seats:d.seats, guest:d.guest, names:d.names}; conn.send({t:'patch',p:clone(d)}); }
      d.burns=d.burns||[]; d.guards=d.guards||[]; d.used=d.used||{1:0,2:0}; d.pas=d.pas||freshPas(); d.ev=[];
      net.shared=clone(d);
      Object.assign(net,{kind:'p2p',code:pd.code,side:2,opp:false,queue:[],seq:d.seq||0});
      phase=''; syncPhase(d); resetLocal(d); onNet(net.shared); paintOnline(); paintNetStatus();
      return;
    }
    if (msg.t==='patch' && net.shared && msg.p && typeof msg.p==='object'){ deepMerge(net.shared,msg.p); onNet(net.shared); }
  });
  conn.on('close',()=>{
    if (net.conn!==conn) return;
    net.conn=null;
    if (net.kind==='p2p'){ net.opp=false; toast('相手との接続が切れました。戻ってくるのを待っています'); render(); retryGuest('close'); }
  });
}
// keep knocking while the host is away (a first-time join gives up at once)
function retryGuest(why){
  const pd=net.pending; if (!pd || !net.peer) return;
  if (!net.kind && !pd.saved){
    netMsg(why==='peer-unavailable' ? `合言葉 <strong>${pd.code}</strong> の部屋が見つかりません。相手が先に「部屋を作る」を押したか確かめてください。` : `合言葉 <strong>${pd.code}</strong> の部屋に入れませんでした。相手が「部屋を作る」を押したまま待っているか確かめてください。`);
    net.pending=null; cleanupPeer(); return;
  }
  net.tries++;
  if (net.tries>40){ netMsg('相手が戻ってきませんでした。「退出」してから入り直してください。'); return; }
  netMsg(`部屋 <strong>${pd.code}</strong>：部屋を作った人の復帰を待っています…`);
  clearTimeout(net.retryT); net.retryT=setTimeout(guestConnect,4000);
}

function leaveRoom(keepMsg){
  if (net.kind==='db'){
    if (net.unsub) net.unsub();
    if (net.ref && net.side) net.ref.update({seats:{[net.side]:''}, updated:Date.now()}).catch(()=>{});
  }
  cleanupPeer();
  Object.assign(net,{kind:null,ref:null,code:null,side:0,seq:0,opp:false,unsub:null,queue:[],shared:null,names:{},pending:null,tries:0});
  if (!keepMsg) paintOnline(); else { $('code').disabled=false; $('host').hidden=false; $('join').hidden=false; $('leave').hidden=true; }
}

// a slow minor progression (Dm Bb F C): pad, bass, arpeggio; drums join in the endgame
const BGM={playing:false,gain:null,timer:null,next:0,step:0};
const PROG=[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]];
const EIGHTH=60/88/2;
function bgmVoice(type,f,t,dur,vol,att){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(BGM.gain); o.start(t); o.stop(t+dur+.05);
}
function bgmHat(t){
  const s=AC.createBufferSource(); s.buffer=noiseBuf(AC); const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
  const g=AC.createGain(); g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+.05);
  s.connect(f).connect(g).connect(BGM.gain); s.start(t,Math.random()); s.stop(t+.07);
}
function bgmStep(step,t){
  const ch=PROG[Math.floor(step/16)%PROG.length], s16=step%16;
  if (s16===0){ ch.forEach(f=>bgmVoice('triangle',f,t,EIGHTH*16,.035,.9)); ch.forEach(f=>bgmVoice('sine',f*2,t,EIGHTH*16,.014,1.2)); }
  if (s16%4===0) bgmVoice('sine',ch[0]/2,t,EIGHTH*3.6,.1,.02);
  const arp=[0,1,2,1,2,0,1,2];
  if (s16%2===0 || Math.random()<.22) bgmVoice('triangle',ch[arp[(s16>>1)%8]]*4,t,EIGHTH*.9,.016,.005);
  if (phase==='play' && !over && counts(board)[2]<=12){
    if (s16%4===0) bgmVoice('sine',62,t,.18,.22,.005);
    if (s16%2===1) bgmHat(t);
  }
}
function bgmTick(){ if (!AC || !BGM.playing) return; while (BGM.next < AC.currentTime+.35){ bgmStep(BGM.step,BGM.next); BGM.next+=EIGHTH; BGM.step++; } }
function bgmStart(){
  if (!cfg.bgm || BGM.playing || !cfg.sound) return;
  const a=ac(); if (!a) return;
  BGM.gain=a.createGain(); BGM.gain.gain.setValueAtTime(0.0001,a.currentTime); BGM.gain.gain.linearRampToValueAtTime(.5,a.currentTime+2.5); BGM.gain.connect(master);
  BGM.playing=true; BGM.next=a.currentTime+.1; BGM.step=0; BGM.timer=setInterval(bgmTick,100);
}
function bgmStop(){
  if (!BGM.playing) return;
  const g=BGM.gain, a=AC; BGM.playing=false; clearInterval(BGM.timer);
  try { g.gain.cancelScheduledValues(a.currentTime); g.gain.setValueAtTime(g.gain.value,a.currentTime); g.gain.linearRampToValueAtTime(0.0001,a.currentTime+.8); } catch(e){}
  setTimeout(()=>{ try { g.disconnect(); } catch(e){} }, 1000);
}
let lastHover=null;
document.addEventListener('pointerover',e=>{
  const b=e.target.closest && e.target.closest('.gbtn,.d-el,.card');
  if (b===lastHover) return; lastHover=b;

});
document.addEventListener('click',e=>{

// a diagonal sweep between screens
function wipe(mid){
  const w=$('wipe');
  uiSfx('whoosh');
  w.animate([{transform:'translateX(-130%) skewX(-14deg)'},{transform:'translateX(0) skewX(-14deg)'}],{duration:340,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'});
  // the screen swap runs on a timer, so a stalled animation can never block the game
  setTimeout(()=>{ if (mid) mid(); w.animate([{transform:'translateX(0) skewX(-14deg)'},{transform:'translateX(130%) skewX(-14deg)'}],{duration:380,delay:90,easing:'cubic-bezier(.6,0,.4,1)',fill:'forwards'}); }, 350);
}
let tSide = cfg.mode==='cpu1' ? 2 : 1;
function paintTitle(){
  $('tSide1').setAttribute('aria-pressed', tSide===1); $('tSide2').setAttribute('aria-pressed', tSide===2);
  document.querySelectorAll('#tCpuOpts [data-lv]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.lv===+cfg.lv));
}
function setMode(m){ if (net.kind || net.peer) leaveRoom(); cfg.mode=m; saveCfg(); paintOnline(); newGame(); }
function closeTitle(m){ bgmStart(); wipe(()=>{ $('title').hidden=true; setMode(m); }); }
function openTitle(){ closeModals(); wipe(()=>{ if (net.kind || net.peer) leaveRoom(); $('title').hidden=false; $('tCpuOpts').hidden=true; paintResume(); }); }
function paintResume(){
  const t=loadResume(), b=$('tResume');
  b.hidden=!t; if (!t) return;
  const vs=`${ELS[t.el[1]].k} 対 ${ELS[t.el[2]].k}`;
  $('tResumeInfo').textContent = t.kind==='local' ? `${t.mode==='pvp' ? 'ふたりで対戦' : 'CPU戦'}・${vs}` : `ネット対戦・部屋 ${t.code}・${vs}`;
}
function resumeGame(t){
  if (net.kind || net.peer) leaveRoom();
  if (t.kind==='local'){
    cfg.mode=t.mode; if (t.lv) cfg.lv=t.lv; saveCfg(); paintOnline();
    restoreLocal(t.d);
    return;
  }
  cfg.mode='online'; saveCfg();
  clearDraftTimers(); phase='draft'; picks={1:'',2:''}; coinInfo=null; resetLocal(freshState());
  // take back the identity this device held in that room
  ME=t.me||ME; try { sessionStorage.setItem('eo-me',ME); } catch(e){}
  $('code').value=t.code; paintOnline();
  if (t.kind==='db') joinDb(t.code, t.side);
  else if (t.side===1) hostP2P(t.code, t.shared);
  else joinP2P(t.code, t.shared);
}
$('tResume').addEventListener('click',()=>{ const t=loadResume(); if (!t){ paintResume(); return; } bgmStart(); wipe(()=>{ $('title').hidden=true; resumeGame(t); }); });
EL_ORDER.forEach((k,i)=>{ const s=document.createElement('span'); s.className='t-emb'; s.textContent=ELS[k].k; s.style.setProperty('--ec',ELS[k].c1); s.style.setProperty('--i',i); $('tEmblems').appendChild(s); });
$('tCpu').addEventListener('click',()=>{ const o=$('tCpuOpts'); o.hidden=!o.hidden; paintTitle(); });
$('tSide1').addEventListener('click',()=>{ tSide=1; paintTitle(); });

document.querySelectorAll('#tCpuOpts [data-lv]').forEach(b=>b.addEventListener('click',()=>{ cfg.lv=+b.dataset.lv; saveCfg(); paintTitle(); }));

function openModal(id){ $(id).hidden=false; uiSfx('open'); const f=$(id).querySelector('.gbtn'); if (f) f.focus(); }
function closeModal(id){ if (!$(id).hidden){ $(id).hidden=true; uiSfx('close'); } }
function closeModals(){ ['menu','settings','skillInfo'].forEach(closeModal); }
function showSkillInfo(p, kind){
  if (phase!=='play') return;
  const el=cfg.el[p], E=ELS[el], C = kind==='card' ? CARDS[el] : PASSIVES[el];
  $('siKind').textContent=`${roleOf(p)}・${E.name}　${kind==='card'?'必殺技カード':'パッシブ'}`;
  const nm=$('siName'); nm.textContent=C.name; nm.style.fontFamily=E.font||''; nm.style.color=tint(p);
  $('siDesc').textContent=C.desc;
  const blk=kind==='card' ? cardBlock(p) : '';
  $('siState').textContent = kind==='card' ? `${usesLabel(p)}　${blk || '使用可能'}` : pasState(p);
  $('skillInfo').querySelector('.m-panel').style.setProperty('--ec', tint(p));
  openModal('skillInfo');
}
// press and hold a card or passive to read it in full (narrow screens hide the text)
let pressT=null, pressAt=null, suppressCardClick=false;
function holdToRead(elm, fn){
  elm.addEventListener('pointerdown',e=>{
    clearTimeout(pressT); pressAt=[e.clientX,e.clientY];
    pressT=setTimeout(()=>{ suppressCardClick=true; setTimeout(()=>{ suppressCardClick=false; },700); fn(); }, 450);
  });
  elm.addEventListener('pointermove',e=>{ if (pressAt && Math.hypot(e.clientX-pressAt[0],e.clientY-pressAt[1])>10) clearTimeout(pressT); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>elm.addEventListener(ev,()=>clearTimeout(pressT)));
  elm.addEventListener('contextmenu',e=>e.preventDefault());
}
for (const p of [1,2]){ holdToRead($('card'+p),()=>showSkillInfo(p,'card')); holdToRead($('pas'+p),()=>showSkillInfo(p,'pas')); }
$('siClose').addEventListener('click',()=>closeModal('skillInfo'));
$('skillInfo').addEventListener('click',e=>{ if (e.target.id==='skillInfo') closeModal('skillInfo'); });
$('menuBtn').addEventListener('click',()=>openModal('menu'));
$('hudSet').addEventListener('click',()=>openModal('settings'));
$('mResume').addEventListener('click',()=>closeModal('menu'));
$('newgame').addEventListener('click',()=>closeModal('menu'));

$('mSettings').addEventListener('click',()=>{ closeModal('menu'); openModal('settings'); });

}
function paintProfile(){
  const nm=$('pName'); if (document.activeElement!==nm) nm.value=myName();
  $('pFav').value=EL_ORDER.includes(prof.fav) ? prof.fav : '';
  let tw=0, tp=0;
  $('pWins').innerHTML=EL_ORDER.map(k=>{
    const w=prof.wins[k]||0, n=prof.plays[k]||0; tw+=w; tp+=n;
    return `<div class="p-win${prof.fav===k?' fav':''}" style="--ec:${ELS[k].c1}"><b>${ELS[k].k}</b><strong>${w}勝</strong><span>${n}戦</span></div>`;
  }).join('');
  $('pTotal').textContent=`通算 ${tw}勝 / ${tp}戦（CPU戦とネット対戦を自動で記録）`;
  const fav=EL_ORDER.includes(prof.fav) ? ELS[prof.fav] : null;
  $('tPlayer').textContent = myName() ? `${myName()}${fav ? `　・　好きな属性 ${fav.k}` : ''}` : '設定でプレイヤー名を決められます';
  document.querySelectorAll('#dGrid .d-el').forEach(b=>b.classList.toggle('fav', b.dataset.el===prof.fav));
}
$('pName').addEventListener('input',e=>{ prof.name=cleanName(e.target.value); saveProf(); paintProfile(); render(); });
$('pName').addEventListener('change',()=>{ announceName(); });
$('pFav').addEventListener('change',e=>{ prof.fav=EL_ORDER.includes(e.target.value) ? e.target.value : ''; saveProf(); paintProfile(); });
paintProfile();

['menu','settings'].forEach(id=>$(id).addEventListener('click',e=>{ if (e.target.id===id) closeModal(id); }));
addEventListener('keydown',e=>{ if (e.key==='Escape') closeModals(); });
const bgmBtn=$('bgm');
function paintBgm(){ bgmBtn.textContent=cfg.bgm?'ON':'OFF'; bgmBtn.setAttribute('aria-pressed',!!cfg.bgm); }
bgmBtn.addEventListener('click',()=>{ cfg.bgm=!cfg.bgm; saveCfg(); paintBgm(); if (cfg.bgm) bgmStart(); else bgmStop(); });

// stone balance gauge between the two players
function updateBalance(a,w){
  const t=(a+w)||1;
  $('balL').style.width=(a/t*100)+'%'; $('balR').style.width=(w/t*100)+'%';
  const b=$('balance');
  b.style.setProperty('--c1', phase==='play' ? tint(1) : '#8f88a6');
  b.style.setProperty('--c2', phase==='play' ? tint(2) : '#cbb8ff');
}
// the band that slides across when the turn changes
let lastTurnShown=0;
function turnBanner(p){
  const tb=$('turnBanner'), E=ELS[cfg.el[p]];
  const me = online() ? net.side : cfg.mode==='pvp' ? 0 : 3-cpuSide();
  const mine = me===0 ? null : me===p;
  tb.style.setProperty('--ec', tint(p));
  tb.querySelector('.tb-sub').textContent = mine===null ? `PLAYER ${p}` : mine ? 'YOUR TURN' : 'ENEMY TURN';
  const m=tb.querySelector('.tb-main');
  m.textContent = mine===null ? `${roleOf(p)}・${E.k}のターン` : mine ? 'あなたのターン' : `${E.k}のターン`;
  m.style.fontFamily=E.font||'';
  tb.animate([{opacity:0,transform:'translateX(-35%)'},{opacity:1,transform:'none',offset:.2},{opacity:1,transform:'none',offset:.75},{opacity:0,transform:'translateX(35%)'}],{duration:1250,easing:'cubic-bezier(.2,.8,.3,1)'});
  uiSfx('turn');
}
function popText(x,y,txt,color,size=28,dur=900){
  const el=document.createElement('div'); el.className='pop'; el.textContent=txt;
  el.style.left=x+'px'; el.style.top=y+'px'; el.style.setProperty('--pc',color); el.style.fontSize=size+'px';
  document.body.appendChild(el);
  el.animate([{transform:'translate(-50%,-30%) scale(.4)',opacity:0},{transform:'translate(-50%,-70%) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-90%) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-130%) scale(.95)',opacity:0}],{duration:dur,easing:'ease-out'});
  setTimeout(()=>el.remove(),dur+80);
}
function stamp(p){
  const el=document.createElement('div'); el.className='stamp';
  el.innerHTML=`<span>PASS</span><small>${ELS[cfg.el[p]].k}は置ける場所がない</small>`;
  el.style.setProperty('--sc',tint(p)); document.body.appendChild(el);
  el.animate([{transform:'translate(-50%,-50%) rotate(-12deg) scale(2.4)',opacity:0},{transform:'translate(-50%,-50%) rotate(-12deg) scale(.95)',opacity:1,offset:.22},{transform:'translate(-50%,-50%) rotate(-12deg) scale(1)',opacity:1,offset:.82},{transform:'translate(-50%,-50%) rotate(-12deg) scale(1)',opacity:0}],{duration:1600,easing:'cubic-bezier(.3,1.4,.5,1)'}); setTimeout(()=>el.remove(),1680);
  setTimeout(()=>{ uiSfx('stamp'); shake(10); }, 300);
}
// skill cut-in: a slanted band races across with the element emblem and the skill's name
function cutIn(p,el,label,name,sub){
  const E=ELS[el], c=document.createElement('div'); c.className='cutin';
  c.style.setProperty('--ec',tint(p));
  c.innerHTML=`<div class="ci-k">${E.k}</div><div class="ci-txt"><div class="ci-label">${label}</div><div class="ci-name">${name}</div><div class="ci-sub">${sub}</div></div>`;
  c.querySelector('.ci-k').style.fontFamily=E.font||''; c.querySelector('.ci-name').style.fontFamily=E.font||''; c.querySelector('.ci-sub').style.fontFamily=E.sfont||'';
  document.body.appendChild(c);
  c.animate([{transform:'skewY(-7deg) translateX(-110%)'},{transform:'skewY(-7deg) translateX(0)',offset:.18},{transform:'skewY(-7deg) translateX(2%)',offset:.82},{transform:'skewY(-7deg) translateX(110%)'}],{duration:1500,easing:'cubic-bezier(.2,.8,.2,1)'}); setTimeout(()=>c.remove(),1580);
  c.querySelector('.ci-k').animate([{transform:'translateY(-50%) skewY(7deg) translateX(30%) scale(1.3)',opacity:0},{transform:'translateY(-50%) skewY(7deg) scale(1)',opacity:.95,offset:.25},{transform:'translateY(-50%) skewY(7deg) translateX(-6%) scale(1)',opacity:.95}],{duration:1500});
  uiSfx('whoosh'); setTimeout(()=>uiSfx('impact'),230);
}
function countUp(el,n){
  const t0=performance.now(), dur=900; let last=-1;
  (function stepCount(now){
    const k=Math.min(1,(now-t0)/dur), v=Math.round(n*(1-Math.pow(1-k,3)));
    if (v!==last){ el.textContent=v; if (v%3===0) uiSfx('tick'); last=v; }
    if (k<1) requestAnimationFrame(stepCount);
  })(t0);
}

// pause every sound while the page is hidden, closed, or no longer being drawn
function checkAway(){
  const away = document.hidden || innerWidth===0 || innerHeight===0 || performance.now()-lastFrameAt>2500;
  if (away===pageAway) return;
  pageAway=away;
  if (!AC) return;
  if (away) AC.suspend().catch(()=>{});
  else if (cfg.sound) AC.resume().catch(()=>{});
}
setInterval(checkAway,500);
document.addEventListener('visibilitychange',checkAway);
addEventListener('pagehide',()=>{ pageAway=true; bgmStop(); if (AC) AC.suspend().catch(()=>{}); });
addEventListener('pageshow',()=>{ pageAway=false; checkAway(); if (cfg.sound && AC) bgmStart(); });

/* ---------- boot (keeps a local game alive across page updates) ---------- */
function restoreLocal(data){
  clearDraftTimers();
  cfg.el={1:data.el[1],2:data.el[2]}; phase='play';
  resetLocal({...freshState(), ...data, burns:data.burns||[], guards:data.guards||[], used:data.used||{1:0,2:0}, pas:data.pas||freshPas(), curses:data.curses||[], kings:data.kings||{1:-1,2:-1}, steel:data.steel||[], rust:data.rust||[], pass:0, ev:[]});
}
function start(data){
  paintOnline();
  if (!online() && data && data.phase==='play' && validDoc(data) && data.el && ALL_ELS.includes(data.el[1]) && ALL_ELS.includes(data.el[2])){
    restoreLocal(data);
    $('title').hidden=true;
  } else newGame();
  paintResume();
}
window.claude?.hot?.snapshot?.(()=>({...curState(), phase, el:{...cfg.el}}));
const hot=window.claude?.hot;
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
})();
