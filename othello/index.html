<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>属性オセロ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Nosifer&family=Train+One&family=Orbitron:wght@900&family=Yuji+Syuku&family=Potta+One&family=DotGothic16&family=Cinzel+Decorative:wght@900&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Yuji+Boku&family=Shippori+Mincho+B1:wght@800&family=Reggae+One&family=RocknRoll+One&family=Kaisei+Decol:wght@700&family=Zen+Antique&family=Creepster&family=Black+Ops+One&display=swap">
<style>
/* Layout: one arena screen — two element "duelist" panels flank a carved stone board; FX canvas floats over everything. Single dark world by design. */
:root{
  color-scheme: dark;
  --void:#08070d;
  --stone:#14121c;
  --stone-2:#1d1a28;
  --ink:#ece8f4;
  --muted:#8e88a3;
  --board:#0d2723;
  --board-2:#123430;
  --line:#25544c;
  --accent:#cbb8ff;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-latin:"Cinzel","Times New Roman",serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, #1a1530 0%, transparent 70%),
    var(--void);
  color:var(--ink);
  font-family:var(--f-body);
  overflow-x:hidden;
}
#stage{
  min-height:100%;
  box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:18px 28px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  position:relative;z-index:1;
}
header{text-align:center;display:grid;gap:2px}
h1{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:.06em;
  background:linear-gradient(90deg,#b98cff 0%,#fff6d8 33%,#ff7a3a 66%,#ffe94a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-wrap:balance;
}
.tag{font-family:var(--f-latin);font-size:12px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase}

.arena{
  width:100%;max-width:1040px;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px) minmax(0,1fr);
  grid-template-areas:"s1 board s2";
  gap:18px;align-items:center;
}
.side{
  --ec:#fff;
  background:linear-gradient(180deg,var(--stone-2),var(--stone));
  border:1px solid #2a2638;border-radius:14px;
  padding:16px;display:grid;gap:12px;justify-items:center;text-align:center;
  transition:box-shadow .4s, border-color .4s, transform .4s;
  min-width:0;
}
.side[data-p="1"]{grid-area:s1}
.side[data-p="2"]{grid-area:s2}
.side.active{border-color:var(--ec);box-shadow:0 0 0 1px var(--ec), 0 0 28px -4px var(--ec);transform:translateY(-2px)}
.sigil{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--ec);box-shadow:0 0 18px -2px var(--ec), inset 0 0 18px -6px var(--ec);
  font-family:var(--f-display);font-size:38px;color:var(--ec);
  text-shadow:0 0 12px var(--ec);
}
.side.active .sigil{animation:sigilSpin 3s ease-in-out infinite}
@keyframes sigilSpin{50%{box-shadow:0 0 34px 2px var(--ec), inset 0 0 24px -4px var(--ec)}}
.role{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.ename{font-family:var(--f-body);font-weight:700;font-size:20px}
.count{font-family:var(--f-latin);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ec);text-shadow:0 0 14px color-mix(in srgb,var(--ec) 60%,transparent)}
.who{max-width:100%;padding:3px 14px;border-radius:999px;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--ec) 16%,#000a);border:1px solid color-mix(in srgb,var(--ec) 55%,transparent);text-shadow:0 0 8px color-mix(in srgb,var(--ec) 60%,transparent)}
.who:empty{display:none}
.sel{display:grid;gap:4px;font-size:11px;letter-spacing:.14em;color:var(--muted);width:100%}
select,button{
  font:inherit;font-size:14px;color:var(--ink);
  background:#0f0d16;border:1px solid #39344c;border-radius:8px;padding:8px 10px;
}
select:focus-visible,button:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--accent)}
button.primary{background:linear-gradient(180deg,#3a2a66,#231a40);border-color:#6a55b0;font-weight:700}

.board-wrap{grid-area:board;width:min(100%, calc(100vh - 230px), 560px);min-width:260px;justify-self:center;position:relative}
#board{
  aspect-ratio:1;width:100%;max-width:100%;box-sizing:border-box;
  display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:10px;
  background:
    radial-gradient(ellipse at 50% 50%, var(--board-2), var(--board) 70%),
    var(--board);
  border-radius:12px;
  border:2px solid #2d5c54;
  box-shadow:0 0 0 6px #0b0a10, 0 0 0 7px #2a2638, 0 30px 80px -20px #000, inset 0 0 60px #0007;
}
.cell{
  position:relative;border:0;padding:0;border-radius:4px;
  background:linear-gradient(145deg,#15403a,#0f302b);
  box-shadow:inset 0 0 0 1px #1e4b44;
  perspective:500px;cursor:default;
}
.cell.hint{cursor:pointer}
.cell.hint::before{
  content:"";position:absolute;inset:38%;border-radius:50%;
  background:var(--hint);opacity:.45;box-shadow:0 0 10px var(--hint);
  animation:hintPulse 1.6s ease-in-out infinite;
}
.cell.hint:hover::before{opacity:.85;inset:30%}
@keyframes hintPulse{50%{opacity:.18}}
.cell.last::after{content:"";position:absolute;inset:2px;border-radius:4px;box-shadow:inset 0 0 0 2px #ffffff40}
.cell.corner{box-shadow:inset 0 0 0 1px #3a7a6e, inset 0 0 14px #66ffe022}
.cell.aim{cursor:crosshair;box-shadow:inset 0 0 0 2px #ff5a1f99}
.cell.aim:hover{background:linear-gradient(145deg,#6a200c,#3a0d05)}
.flame{
  position:absolute;inset:0;border-radius:4px;pointer-events:none;z-index:1;transform-origin:50% 100%;
  background:
    radial-gradient(ellipse 55% 75% at 50% 92%, #fff3b0 0%, #ff8a1f 32%, #c4210f 62%, transparent 78%),
    radial-gradient(ellipse 35% 60% at 26% 90%, #ff5a1f 0%, transparent 70%),
    radial-gradient(ellipse 35% 60% at 74% 90%, #ff5a1f 0%, transparent 70%),
    #3a0d05;
  box-shadow:0 0 16px #ff5a1f, inset 0 0 10px #ff3a0a;
  animation:flicker .32s steps(2) infinite alternate;
  display:grid;place-items:start end;box-sizing:border-box;padding:2px 5px;
  font-family:var(--f-latin);font-weight:700;font-size:13px;color:#fff;text-shadow:0 0 4px #000,0 0 2px #000;
}
@keyframes flicker{from{filter:brightness(1);transform:scaleY(1)}to{filter:brightness(1.35);transform:scaleY(1.06)}}
.card{
  width:100%;box-sizing:border-box;display:grid;gap:3px;text-align:left;padding:10px 12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--ec) 24%,#0f0d16),#0f0d16 72%);
  border:1px solid color-mix(in srgb,var(--ec) 60%,#39344c);border-radius:10px;
}
.card .c-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.card .c-uses{font-variant-numeric:tabular-nums;color:var(--ink)}
.card .c-name{font-family:var(--f-display);font-size:16px;line-height:1.25;color:var(--ec);text-shadow:0 0 10px color-mix(in srgb,var(--ec) 60%,transparent)}
.card .c-desc{font-size:11px;line-height:1.5;color:var(--muted)}
.card.ready{animation:cardGlow 1.8s ease-in-out infinite}
@keyframes cardGlow{50%{box-shadow:0 0 20px -2px var(--ec)}}
.card.armed{outline:2px solid var(--ec);outline-offset:1px;box-shadow:0 0 26px var(--ec);opacity:1}
.status small.hot{color:#ffd08a}
.disc{
  position:absolute;inset:9%;border-radius:50%;
  transform-style:preserve-3d;will-change:transform;
  display:grid;place-items:center;
  font-family:var(--f-display);font-size:clamp(10px,2.6vw,20px);
}
.disc::after{content:attr(data-k);opacity:.28;mix-blend-mode:overlay}
.disc[data-el="dark"]{
  background:radial-gradient(circle at 34% 28%,#5a3594 0%,#1a0a30 42%,#020005 78%);
  box-shadow:0 0 12px #8b3dff99,0 3px 6px #000,inset 0 -4px 8px #000,inset 0 2px 5px #b48bff55;
  color:#d9b8ff;
}
.disc[data-el="light"]{
  background:radial-gradient(circle at 34% 28%,#fff 0%,#fff7dc 42%,#e3c983 88%);
  box-shadow:0 0 18px #fff1b0,0 0 34px #ffd96a88,0 3px 6px #0008,inset 0 -4px 8px #c9a65588;
  animation:divine 2.4s ease-in-out infinite;
  color:#b88a1a;
}
.disc[data-el="fire"]{
  background:radial-gradient(circle at 34% 28%,#ffe0a0 0%,#ff6a22 40%,#9c120a 86%);
  box-shadow:0 0 16px #ff4a1a,0 -6px 22px #ff8a1f99,0 3px 6px #000a,inset 0 -4px 8px #5a0500;
  animation:ember .9s ease-in-out infinite alternate;
  color:#fff1c0;
}
.disc[data-el="thunder"]{
  background:radial-gradient(circle at 34% 28%,#fffde0 0%,#ffe31a 40%,#b88a00 88%);
  box-shadow:0 0 14px #ffe600aa,0 3px 6px #000a,inset 0 -4px 8px #7a5a00;
  animation:charged 1.7s steps(1) infinite;
  color:#5b3f00;
}

.status{
  font-family:var(--f-body);font-weight:700;font-size:18px;letter-spacing:.06em;min-height:1.4em;text-align:center;
}
.status small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.1em;margin-left:8px}
.status.crit{color:#ffb4a0;animation:critText 1s ease-in-out infinite}
@keyframes critText{50%{text-shadow:0 0 12px #ff5a3a}}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:end;max-width:760px}
.controls .sel{width:auto}
.online{
  width:100%;max-width:760px;box-sizing:border-box;display:grid;gap:10px;justify-items:center;
  background:linear-gradient(180deg,var(--stone-2),var(--stone));border:1px solid #2a2638;border-radius:14px;padding:14px;
}
.online-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:end}
.online .sel{width:auto}
#code{
  font-family:var(--f-latin);font-weight:700;font-size:22px;letter-spacing:.4em;text-align:center;width:7.5em;
  color:var(--ink);background:#0f0d16;border:1px solid #39344c;border-radius:8px;padding:6px 4px 6px 12px;
  font-variant-numeric:tabular-nums;
}
#code:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#code:disabled{opacity:.6}
.net-msg{margin:0;font-size:13px;color:var(--muted);text-align:center;max-width:60ch;line-height:1.6}
.net-msg strong{color:var(--ink)}
button:disabled,select:disabled{opacity:.45;cursor:not-allowed}

/* Stone auras, seals and statuses */
.aura{position:absolute;inset:3%;border-radius:50%;pointer-events:none}
.aura[data-el="dark"]{inset:-3%;background:conic-gradient(from 0deg,transparent 0 18%,#a259ff99 30%,transparent 46% 68%,#4b12a0bb 80%,transparent 94%);filter:blur(3px);animation:auraSpin 2.6s linear infinite}
.aura[data-el="light"]{inset:-6%;background:repeating-conic-gradient(#fff3c099 0 5deg,transparent 5deg 30deg);-webkit-mask:radial-gradient(circle,transparent 40%,#000 50%,transparent 70%);mask:radial-gradient(circle,transparent 40%,#000 50%,transparent 70%);animation:auraSpin 9s linear infinite,auraPulse 2.2s ease-in-out infinite}
.aura[data-el="fire"]{inset:-16% 8% 22% 8%;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse 50% 60% at 50% 75%,#ffb04acc,#ff5a1f66 45%,transparent 72%);filter:blur(2px);transform-origin:50% 100%;animation:flicker .28s steps(2) infinite alternate}
.aura[data-el="thunder"]{inset:1%;border:2px dashed #ffe600cc;box-shadow:0 0 10px #ffe60088;animation:auraSpin 1.2s linear infinite,zap .5s steps(2) infinite}
@keyframes auraSpin{to{transform:rotate(360deg)}}
@keyframes divine{50%{box-shadow:0 0 26px #ffffff,0 0 50px #ffd96acc,0 3px 6px #0008,inset 0 -4px 8px #c9a65588}}
@keyframes ember{from{filter:brightness(1) saturate(1)}to{filter:brightness(1.35) saturate(1.3)}}
@keyframes charged{0%,86%,100%{filter:none;box-shadow:0 0 14px #ffe600aa,0 3px 6px #000a,inset 0 -4px 8px #7a5a00}88%{filter:brightness(2.2);box-shadow:0 0 26px #fffbe0,0 0 40px #6ad8ff,inset 0 0 10px #fff}92%{filter:brightness(1.4)}95%{filter:brightness(2)}
}
.aura[data-el="light"]::after{content:"";position:absolute;left:22%;right:22%;top:-14%;height:16%;border-radius:50%;border:2px solid #fff6c8;box-shadow:0 0 8px #ffd96a,0 0 16px #fff3b0,inset 0 0 4px #fff;animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{transform:translateY(-3px);box-shadow:0 0 14px #ffe9a0,0 0 26px #fff6c8,inset 0 0 6px #fff}}
.aura[data-el="fire"]::before,.aura[data-el="fire"]::after{content:"";position:absolute;bottom:20%;width:42%;height:120%;border-radius:50% 50% 30% 30%/70% 70% 30% 30%;
  background:radial-gradient(ellipse 50% 70% at 50% 90%,#fff3b0,#ff8a1f 40%,#ff3a0a99 65%,transparent 80%);filter:blur(1.5px);transform-origin:50% 100%}
.aura[data-el="fire"]::before{left:6%;animation:tongue .55s ease-in-out infinite alternate}
.aura[data-el="fire"]::after{right:6%;animation:tongue .7s ease-in-out infinite alternate-reverse}
@keyframes tongue{from{transform:scaleY(.75) rotate(-8deg);opacity:.75}to{transform:scaleY(1.15) rotate(6deg);opacity:1}}
.aura[data-el="thunder"]::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid #6ad8ff;opacity:0;animation:crackle 1.3s steps(1) infinite}
@keyframes crackle{0%,70%{opacity:0;transform:rotate(0)}72%{opacity:1;transform:rotate(40deg) scale(1.05)}76%{opacity:.2}80%{opacity:.9;transform:rotate(-30deg)}84%{opacity:0}}
@keyframes auraPulse{50%{opacity:.45}}
@keyframes zap{50%{border-color:#6ad8ffcc;box-shadow:0 0 14px #6ad8ff}}
.disc[data-el="none1"]{background:radial-gradient(circle at 34% 28%,#6a6578,#26232f 60%,#0e0d12);box-shadow:0 3px 6px #000}
.disc[data-el="none2"]{background:radial-gradient(circle at 34% 28%,#ffffff,#d8d4e2 55%,#9a95a8);box-shadow:0 3px 6px #0008}
.disc[data-el^="none"]::after{content:none}
.cell.guard::before{content:"";position:absolute;inset:1%;border-radius:50%;border:2px solid #ffb04a;box-shadow:0 0 12px #ff5a1f,inset 0 0 10px #ff5a1f;z-index:2;pointer-events:none;animation:guardPulse 1s ease-in-out infinite}
@keyframes guardPulse{50%{box-shadow:0 0 22px #ff8a1f,inset 0 0 14px #ff8a1f}}
.flame.chain{background:radial-gradient(circle,#2a2410cc,#0d0b06ee);box-shadow:0 0 12px #ffe9a088,inset 0 0 10px #000;animation:none;padding:0;place-items:stretch;overflow:visible}
.flame.chain svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1px 1px #000) drop-shadow(0 0 4px #fff1b066)}
.cell.marked::after{content:"";position:absolute;inset:-8%;border-radius:50%;border:3px solid var(--mk,#fff);box-shadow:0 0 16px var(--mk,#fff),inset 0 0 12px var(--mk,#fff);z-index:3;pointer-events:none;animation:markPulse .42s ease-in-out infinite alternate}
@keyframes markPulse{from{transform:scale(1.18);opacity:.55}to{transform:scale(.9);opacity:1}}
#board.blind{background:#000;border-color:#1a0a2a;box-shadow:0 0 0 6px #000,0 0 0 7px #2a1040,inset 0 0 60px #4b12a0}
#board.blind .cell{background:#030205;box-shadow:none}
#board.blind .disc,#board.blind .aura,#board.blind .flame{visibility:hidden}
#board.blind .cell.guard::before,#board.blind .cell.last::after{display:none}
#board.blind .cell.hint::before{opacity:.95;animation:none;box-shadow:0 0 16px var(--hint)}
.pas{width:100%;box-sizing:border-box;display:grid;gap:2px;text-align:left;padding:8px 12px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--ec) 45%,#39344c);background:#0f0d16aa}
.pas .p-top{display:flex;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--muted)}
.pas .p-state{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pas .p-name{font-weight:700;font-size:14px;color:var(--ec)}
.pas .p-desc{font-size:11px;line-height:1.5;color:var(--muted)}
.pas.awake{border-style:solid;box-shadow:0 0 18px -2px var(--ec)}
.card .c-note{font-size:11px;color:#ffb4a0}
.card .c-note:empty{display:none}

/* Element draft */
#draft{position:absolute;inset:0;z-index:3;display:grid;place-items:center;border-radius:12px;background:radial-gradient(ellipse at 50% 40%,#1a1530f0,#05040af5);text-align:center;padding:16px;box-sizing:border-box;overflow:auto}
.d-inner{display:grid;gap:10px;justify-items:center;max-width:100%;perspective:600px}
.d-eyebrow{font-family:var(--f-latin);font-size:11px;letter-spacing:.4em;color:var(--muted)}
.d-title{font-family:var(--f-display);font-size:clamp(22px,5vw,34px);text-wrap:balance}
.d-sub{font-size:13px;color:var(--muted);line-height:1.7}
.d-sub strong{color:var(--ink)}
.d-sub small{font-size:12px;color:var(--ink);letter-spacing:.06em}
#dGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px;width:min(100%,520px)}
.d-el{--ec:#fff;display:grid;gap:3px;justify-items:center;padding:10px 4px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ec) 55%,#39344c);background:linear-gradient(180deg,color-mix(in srgb,var(--ec) 18%,#0f0d16),#0f0d16);transition:transform .15s,box-shadow .15s}
.d-el .k{font-family:var(--f-display);font-size:34px;line-height:1.1;color:var(--ec);text-shadow:0 0 14px var(--ec)}
.d-el .n{font-weight:700;font-size:12px}
.d-el .s{font-size:10px;line-height:1.45;color:var(--muted)}
.d-el:hover:not(:disabled){box-shadow:0 0 18px var(--ec);transform:translateY(-2px)}
.coin{width:96px;height:96px;position:relative;transform-style:preserve-3d}
.coin-face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--f-display);font-size:22px;
  background:radial-gradient(circle at 35% 30%,#fff6c8,#d9a93a 60%,#7a5410);color:#3a2604;box-shadow:inset 0 0 0 4px #f5d27a,inset 0 0 0 7px #8a6418,0 6px 20px #000a}
.coin-face.back{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#f2f2f6,#a3a8b8 60%,#4a4f60);color:#1d2030;box-shadow:inset 0 0 0 4px #e0e3ec,inset 0 0 0 7px #5a6072,0 6px 20px #000a}
.d-timer{font-family:var(--f-latin);font-weight:700;font-size:28px;color:#ffd08a;font-variant-numeric:tabular-nums}
.d-timer:empty{display:none}
@media (max-width:480px){#dGrid{grid-template-columns:repeat(4,minmax(0,1fr))}.d-el .k{font-size:26px}}
@media (max-width:520px){.card .c-desc,.pas .p-desc{display:none}.card,.pas{padding:7px 9px}.card .c-name{font-size:14px}}

/* Skill guide dialog */
#helpBox{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:#05040acc;backdrop-filter:blur(3px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box}
.h-panel{width:min(100%,760px);max-height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(180deg,var(--stone-2),var(--stone));border:1px solid #3a3450;border-radius:14px;overflow:hidden}
.h-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #2a2638}
.h-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.h-body{overflow:auto;padding:14px 16px;display:grid;gap:12px}
.h-el{--ec:#fff;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px;border-radius:10px;border:1px solid color-mix(in srgb,var(--ec) 45%,#2a2638);background:color-mix(in srgb,var(--ec) 7%,#0f0d16)}
.h-el .hk{grid-row:span 3;font-family:var(--f-display);font-size:40px;line-height:1;color:var(--ec);text-shadow:0 0 14px var(--ec);align-self:center}
.h-el .hn{font-weight:700;font-size:15px}
.h-el dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:13px;line-height:1.6}
.h-el dt{color:var(--ec);font-weight:700;white-space:nowrap}
.h-el dd{margin:0;color:var(--ink)}
.h-el dd small{color:var(--muted)}
.h-rules{font-size:13px;line-height:1.7;color:var(--muted);margin:0;padding-left:1.2em}
.h-rules strong{color:var(--ink)}
@media (max-width:480px){.h-el{grid-template-columns:1fr}.h-el .hk{grid-row:auto}}

/* 星・王・岩 stones */
.disc[data-el="star"]{
  background:
    radial-gradient(circle at 30% 30%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 66% 38%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 44% 70%,#ffe9a0 0 1px,transparent 2px),
    radial-gradient(circle at 72% 72%,#fff 0 .8px,transparent 1.6px),
    radial-gradient(circle at 34% 28%,#3b4fb0 0%,#141a5a 50%,#05061e 90%);
  box-shadow:0 0 14px #6f8cffaa,0 3px 6px #000a,inset 0 -4px 8px #000,inset 0 2px 6px #9db8ff66;
  color:#ffe9a0;animation:twinkle 2.2s ease-in-out infinite;
}
@keyframes twinkle{50%{box-shadow:0 0 22px #9db8ff,0 0 34px #ffd86a55,0 3px 6px #000a,inset 0 -4px 8px #000,inset 0 2px 6px #9db8ff99}}
.disc[data-el="king"]{
  background:radial-gradient(circle at 34% 28%,#c77dff 0%,#6a1fb0 45%,#2a0650 88%);
  box-shadow:0 0 0 2px #e6b43a,0 0 0 3px #7a5410,0 0 14px #ffd34d88,0 3px 6px #000a,inset 0 -4px 8px #1a0030,inset 0 2px 5px #e3b3ff66;
  color:#ffe08a;
}
.disc[data-el="rock"]{
  background:
    radial-gradient(circle at 30% 36%,#0003 0 2px,transparent 3px),
    radial-gradient(circle at 62% 58%,#0004 0 2.5px,transparent 3.5px),
    radial-gradient(circle at 48% 24%,#fff4 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 70% 30%,#0003 0 1.5px,transparent 2.5px),
    radial-gradient(circle at 34% 28%,#d6c3a0 0%,#8a7458 45%,#3e3226 90%);
  box-shadow:0 3px 6px #000c,inset 0 -5px 8px #1e170f,inset 0 2px 4px #f5e6c855;
  color:#2a2018;
}
.aura[data-el="star"]{inset:-7%;background:repeating-conic-gradient(#9db8ff88 0 2deg,transparent 2deg 24deg,#ffd86a88 24deg 26deg,transparent 26deg 45deg);-webkit-mask:radial-gradient(circle,transparent 44%,#000 52%,transparent 68%);mask:radial-gradient(circle,transparent 44%,#000 52%,transparent 68%);animation:auraSpin 14s linear infinite}
.aura[data-el="king"]{inset:-6%;background:radial-gradient(circle,transparent 48%,#ffd34d66 56%,transparent 70%);animation:auraPulse 2.6s ease-in-out infinite}
.aura[data-el="rock"]{inset:6%;box-shadow:0 5px 0 #1a130c,0 0 0 1px #5a4a36}

/* 闇: black flame over every dark stone, and a curse on stones taken by 地獄門 */
.disc[data-el="dark"]{animation:voidPulse 2.8s ease-in-out infinite}
@keyframes voidPulse{50%{box-shadow:0 0 22px #a259ff,0 0 38px #4b12a0aa,0 3px 6px #000,inset 0 -4px 8px #000,inset 0 2px 8px #b48bffaa}}
.aura[data-el="dark"]::after{content:"";position:absolute;inset:-14% 12% 34% 12%;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse 50% 70% at 50% 85%,#12001fee,#4b12a077 50%,transparent 75%);filter:blur(2px);transform-origin:50% 100%;animation:tongue .9s ease-in-out infinite alternate}
.cell.cursed .aura{inset:-20%!important;background:conic-gradient(from 0deg,#000 0 10%,#a259ffdd 20%,#000 35%,#6a1fd0cc 55%,#000 70%,#a259ffdd 85%,#000)!important;-webkit-mask:none!important;mask:none!important;filter:blur(4px);animation:auraSpin .9s linear infinite!important;opacity:.95}
.cell.cursed .disc{box-shadow:0 0 24px #a259ff,0 0 44px #000,inset 0 0 16px #a259ff!important}
.cell.cursed::before{content:"呪";position:absolute;right:1px;top:-2px;z-index:5;font-family:var(--f-display);font-size:clamp(9px,1.8vw,14px);color:#f0dcff;text-shadow:0 0 6px #a259ff,0 0 10px #a259ff,0 0 2px #000;pointer-events:none;animation:hintPulse 1s ease-in-out infinite}

/* 炎: sealed squares are a roaring fire */
.flame:not(.chain){
  inset:-4% -4% 0 -4%;overflow:visible;
  background:radial-gradient(ellipse 60% 85% at 50% 96%,#fff6c8 0%,#ffb04a 22%,#ff5a1f 48%,#b3120b 70%,transparent 86%),#3a0d05;
  box-shadow:0 0 22px #ff5a1f,0 0 44px #ff3a0a99,inset 0 0 14px #ff8a1f;
  animation:flicker .2s steps(2) infinite alternate;z-index:2;
}
.flame:not(.chain)::before,.flame:not(.chain)::after{content:"";position:absolute;bottom:35%;width:50%;height:170%;border-radius:50% 50% 30% 30%/70% 70% 30% 30%;background:radial-gradient(ellipse 50% 70% at 50% 90%,#fff3b0,#ff8a1f 40%,#ff3a0aaa 65%,transparent 82%);filter:blur(1.5px);transform-origin:50% 100%;pointer-events:none;z-index:-1}
.flame:not(.chain)::before{left:0;animation:tongue .42s ease-in-out infinite alternate}
.flame:not(.chain)::after{right:0;animation:tongue .58s ease-in-out infinite alternate-reverse}

/* 岩: the frame around the board, with three rocks */
.cell.ring{display:none}
#board.ext{grid-template-columns:repeat(10,1fr)}
#board.ext .cell{grid-row:var(--gr);grid-column:var(--gc)}
#board.ext .cell.ring{display:block;visibility:hidden}
#board.ext .cell.ring.rock{visibility:visible;background:radial-gradient(circle at 30% 30%,#a8977c,#5e4e3b 55%,#2e251b);box-shadow:inset 0 0 0 1px #8a7a60,inset 0 -3px 6px #000a,0 0 10px #c08a4a66;border-radius:32% 42% 36% 46%}
#board.blind .cell.ring.rock{background:#030205;box-shadow:none}

/* 王: the crown, the decree */
.deco{position:absolute;inset:0;pointer-events:none;z-index:4}
.deco svg{position:absolute;left:10%;width:80%;top:-40%;overflow:visible;filter:drop-shadow(0 2px 2px #000) drop-shadow(0 0 6px #ffd34d)}
.deco.crowned svg{animation:crownFloat 2.4s ease-in-out infinite}
@keyframes crownFloat{50%{transform:translateY(-2px)}}
.deco.forced{border-radius:4px;box-shadow:inset 0 0 0 2px #ffd34d,0 0 18px #ffd34d;background:radial-gradient(circle,#ffd34d33,transparent 70%);animation:decreePulse 1s ease-in-out infinite}
.deco.forced::after{content:"王命";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(9px,1.9vw,14px);color:#fff4c2;text-shadow:0 0 6px #b8860b,0 0 2px #000;white-space:nowrap}
.cell.decree{cursor:pointer;box-shadow:inset 0 0 0 2px #ffd34d,0 0 14px #ffd34d88;animation:decreePulse .9s ease-in-out infinite}
@keyframes decreePulse{50%{box-shadow:inset 0 0 0 3px #fff4c2,0 0 22px #ffd34d}}
#board.blind .deco{visibility:hidden}
#board.blind .deco.forced{visibility:visible}

/* 星座封印 on a panel */
.side.hushed{border-color:#9db8ff!important;box-shadow:0 0 0 1px #9db8ff,0 0 26px -4px #6f8cff!important;
  background-image:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 70% 20%,#cfe0ff 0 1px,transparent 1.5px),radial-gradient(circle at 50% 80%,#fff 0 1px,transparent 1.5px),linear-gradient(180deg,#1b2050,#0c0e26)}
.side.hushed .card,.side.hushed .pas{filter:grayscale(.85) brightness(.75)}

/* shifted shades for look-alike matchups (後手 side) */
.disc[data-el="dark"][data-alt]{background:radial-gradient(circle at 34% 28%,#4a6ad8 0%,#101a50 45%,#000208 80%);box-shadow:0 0 12px #5a7cff99,0 3px 6px #000,inset 0 -4px 8px #000,inset 0 2px 5px #8aa4ff55}
.disc[data-el="light"][data-alt]{background:radial-gradient(circle at 34% 28%,#ffffff 0%,#eef3fb 42%,#a8b6cc 88%);box-shadow:0 0 16px #dfe8ffcc,0 3px 6px #0008,inset 0 -4px 8px #8090a8aa;color:#6a7a96}
.disc[data-el="fire"][data-alt]{background:radial-gradient(circle at 34% 28%,#ffc8d0 0%,#e01a3a 42%,#6a0018 86%);box-shadow:0 0 16px #ff3355,0 3px 6px #000a,inset 0 -4px 8px #3a000a}
.disc[data-el="thunder"][data-alt]{background:radial-gradient(circle at 34% 28%,#fbffd8 0%,#c8f520 42%,#5f7f00 88%);box-shadow:0 0 14px #c8f520aa,0 3px 6px #000a,inset 0 -4px 8px #3a5000;color:#2a3a00}
.disc[data-el="star"][data-alt]{background:radial-gradient(circle at 30% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 66% 38%,#fff 0 1px,transparent 2px),radial-gradient(circle at 44% 70%,#c8ffff 0 1px,transparent 2px),radial-gradient(circle at 34% 28%,#2fb0b0 0%,#0a4a5a 50%,#021418 90%);box-shadow:0 0 14px #3ec9c9aa,0 3px 6px #000a,inset 0 -4px 8px #000}
.disc[data-el="king"][data-alt]{background:radial-gradient(circle at 34% 28%,#ff9aa8 0%,#b0102a 45%,#4a0010 88%);box-shadow:0 0 0 2px #e6b43a,0 0 0 3px #7a5410,0 0 14px #ff5a7a88,0 3px 6px #000a,inset 0 -4px 8px #2a0008}
.disc[data-el="rock"][data-alt]{background:radial-gradient(circle at 30% 36%,#0003 0 2px,transparent 3px),radial-gradient(circle at 62% 58%,#0004 0 2.5px,transparent 3.5px),radial-gradient(circle at 34% 28%,#e6e6e6 0%,#8f8f8f 45%,#3a3a3a 90%);box-shadow:0 3px 6px #000c,inset 0 -5px 8px #1a1a1a}

/* a card that is ready to use shimmers even off-turn */
.card{position:relative;overflow:hidden}
.card.avail{border-color:var(--ec);box-shadow:0 0 14px -2px var(--ec)}
.card.avail::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,color-mix(in srgb,var(--ec) 45%,#fff) 50%,transparent 65%);transform:translateX(-120%);animation:cardShine 2.6s ease-in-out infinite;pointer-events:none}
@keyframes cardShine{60%,100%{transform:translateX(120%)}}

/* royal flag */
.deco svg.flag{left:30%;top:auto;bottom:38%;width:auto;height:150%;filter:drop-shadow(0 2px 2px #000) drop-shadow(0 0 6px #ffd34d)}
.deco.forced::after{content:none}
.bigflag{position:fixed;z-index:5;pointer-events:none;aspect-ratio:60/100}
.bigflag svg{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 6px #000) drop-shadow(0 0 16px #ffd34d)}

/* castle scenes */
#castle{position:fixed;inset:0;z-index:5;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;opacity:0}
#castle.fall{background:radial-gradient(ellipse at 50% 85%,#6a0e0e,#1a0306 65%,#060103)}
#castle.rise{background:radial-gradient(ellipse at 50% 88%,#ffe08a,#c88f1a 28%,#3a1d5a 72%,#12081e)}
#castle svg{width:min(92vw,720px);height:auto;margin-bottom:3vh;overflow:visible}
#castle .cpart,#castle .cfin,#castle .pp,#castle .pj{transform-box:fill-box;transform-origin:50% 100%}

/* ---------- game UI ---------- */
.gbtn{
  position:relative;font-family:var(--f-body);font-weight:700;letter-spacing:.08em;color:#f3ead2;
  background:linear-gradient(180deg,#3a2f52,#1c1628 55%,#140f1e);
  border:1px solid #8a7444;border-radius:8px;padding:11px 20px;
  box-shadow:inset 0 1px 0 #ffffff22,inset 0 -2px 0 #00000066,0 4px 12px #0008;
  text-shadow:0 1px 0 #000;transition:transform .12s,box-shadow .2s,border-color .2s;
  display:grid;justify-items:center;gap:2px;
}
.gbtn small{font-size:11px;font-weight:400;letter-spacing:.1em;color:#cfc3a6}
.gbtn:hover:not(:disabled){border-color:#e6c77a;box-shadow:inset 0 1px 0 #ffffff33,inset 0 -2px 0 #00000066,0 0 18px #e6c77a55,0 4px 12px #0008;transform:translateY(-1px)}
.gbtn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.gbtn.primary{background:linear-gradient(180deg,#c8963a,#7a5414 60%,#5a3c0c);color:#fff8e0;border-color:#ffe08a}
.gbtn[aria-pressed="true"]{border-color:#ffe08a;box-shadow:inset 0 0 0 1px #ffe08a,0 0 14px #ffe08a55;color:#fff4c2}
.gbtn.small{padding:7px 14px;font-size:13px}

.hud{width:100%;max-width:1040px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hud-logo{font-family:var(--f-display);font-size:clamp(20px,4vw,28px);letter-spacing:.06em;
  background:linear-gradient(90deg,#b98cff,#fff6d8,#ff7a3a,#ffe94a,#9db8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000)}
.balance{width:100%;max-width:560px;height:12px;border-radius:999px;position:relative;overflow:hidden;background:#0c0a12;border:1px solid #8a744466;box-shadow:inset 0 2px 6px #000}
.balance i{position:absolute;top:0;bottom:0;transition:width .7s cubic-bezier(.2,.8,.3,1)}
#balL{left:0;background:linear-gradient(90deg,color-mix(in srgb,var(--c1,#888) 40%,#000),var(--c1,#888));box-shadow:0 0 10px var(--c1,#888)}
#balR{right:0;background:linear-gradient(270deg,color-mix(in srgb,var(--c2,#ccc) 40%,#000),var(--c2,#ccc));box-shadow:0 0 10px var(--c2,#ccc)}
.balance::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff9;transform:translateX(-50%)}

.side{background:linear-gradient(180deg,#241e36,#141020);border:1px solid #8a744455;box-shadow:inset 0 1px 0 #ffffff12,0 12px 30px -12px #000}
.status{padding:8px 20px;border-radius:999px;background:linear-gradient(180deg,#1f1a2ccc,#110d19cc);border:1px solid #8a744444;box-shadow:inset 0 1px 0 #ffffff10}
#board{box-shadow:0 0 0 6px #0b0a10,0 0 0 7px #8a744477,0 0 0 11px #0b0a10,0 0 0 12px #8a744433,0 30px 80px -20px #000,inset 0 0 60px #0007}
#toast{border-radius:10px;border:1px solid #8a744488;background:linear-gradient(180deg,#241e36f2,#14101ff2);box-shadow:0 10px 30px #000a;padding:10px 20px 10px 16px;transform:translate(-50%,-10px);transition:opacity .3s,transform .3s;white-space:normal;max-width:min(92vw,520px);text-align:center}
#toast::before{content:"◆";color:#e6c77a;margin-right:8px}
#toast.show{transform:translate(-50%,0)}

/* title screen */
#title{position:fixed;inset:0;z-index:8;display:grid;place-items:center;overflow:auto;
  background:radial-gradient(ellipse at 50% 28%,#2c2050 0%,#0b0814 62%,#05040a);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box}
.t-inner{display:grid;gap:18px;justify-items:center;text-align:center;width:min(100%,460px)}
.t-logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(40px,13vw,84px);line-height:1.1;white-space:nowrap;
  background:linear-gradient(90deg,#b98cff,#fff6d8,#ff7a3a,#ffe94a,#9db8ff,#ffd34d,#d0a066,#b98cff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:logoFlow 9s linear infinite;
  filter:drop-shadow(0 5px 0 #000) drop-shadow(0 0 26px #7a5cff77)}
@keyframes logoFlow{to{background-position:300% 0}}
.t-sub{font-family:"Cinzel Decorative",var(--f-latin);font-weight:900;letter-spacing:.5em;font-size:clamp(11px,2.4vw,15px);color:#cbb8ff;margin-top:-6px}
.t-emblems{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.t-emb{--ec:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:21px;color:var(--ec);border:1.5px solid var(--ec);
  box-shadow:0 0 14px -2px var(--ec),inset 0 0 12px -4px var(--ec);background:#0b0814;animation:embFloat 3s ease-in-out infinite;animation-delay:calc(var(--i)*-.43s)}
@keyframes embFloat{50%{transform:translateY(-7px)}}
.t-menu{display:grid;gap:10px;width:100%}
.t-menu > .gbtn{width:100%;font-size:17px;padding:14px}
.t-opts{display:grid;gap:10px;padding:14px;border-radius:12px;background:#0f0b1acc;border:1px solid #8a744455;text-align:left}
.seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.seg .gbtn{padding:9px 6px;font-size:14px}
.t-label{font-size:11px;letter-spacing:.24em;color:var(--muted)}
.t-foot{font-size:11px;color:var(--muted)}

/* modals */
.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05040acc;backdrop-filter:blur(3px);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;box-sizing:border-box}
.m-panel{width:min(100%,380px);display:grid;gap:10px;padding:22px;background:linear-gradient(180deg,#241e36,#141020);border:1px solid #8a744499;border-radius:14px;box-shadow:0 20px 60px #000c,inset 0 1px 0 #ffffff14}
.m-title{font-family:"Cinzel Decorative",var(--f-latin);font-weight:900;font-size:24px;letter-spacing:.2em;text-align:center;color:#f3e2b0;margin-bottom:4px}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 2px;border-bottom:1px solid #ffffff10}
.m-row > span{display:grid;gap:2px;font-weight:700}
.m-row small{font-size:11px;font-weight:400;color:var(--muted)}
.m-row .gbtn{min-width:76px;padding:8px 12px}
#helpBox{z-index:11}

/* wipe between screens */
#wipe{position:fixed;top:-10vh;bottom:-10vh;left:-25vw;right:-25vw;z-index:9;pointer-events:none;transform:translateX(-130%) skewX(-14deg);
  background:linear-gradient(90deg,#e6c77a 0 6px,#0b0814 6px calc(100% - 6px),#e6c77a calc(100% - 6px));box-shadow:0 0 60px #000}

/* turn band, pops, PASS stamp, skill cut-in */
#turnBanner{--ec:#fff;position:fixed;left:0;right:0;top:40%;z-index:6;pointer-events:none;opacity:0}
#turnBanner .tb-band{padding:12px 0;text-align:center;display:grid;gap:2px;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ec) 45%,#000c) 22%,color-mix(in srgb,var(--ec) 45%,#000c) 78%,transparent);
  border-top:1px solid color-mix(in srgb,var(--ec) 80%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ec) 80%,transparent)}
#turnBanner .tb-sub{font-family:"Black Ops One",var(--f-latin);letter-spacing:.5em;font-size:12px;color:#fff;opacity:.85}
#turnBanner .tb-main{font-family:var(--f-display);font-size:clamp(24px,5.5vw,42px);color:#fff;text-shadow:0 0 14px var(--ec),0 3px 0 #000}
.pop{position:fixed;z-index:6;pointer-events:none;font-family:"Black Ops One",var(--f-latin);color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;
  text-shadow:0 0 10px var(--pc),0 0 22px var(--pc);white-space:nowrap;letter-spacing:.04em}
.stamp{--sc:#ff4040;position:fixed;left:50%;top:44%;z-index:6;pointer-events:none;display:grid;justify-items:center;gap:4px;
  padding:6px 30px 10px;border:6px solid #ff4a4a;border-radius:14px;background:#14000699;box-shadow:0 0 30px #ff4a4a66,inset 0 0 20px #ff4a4a44}
.stamp span{font-family:"Black Ops One",var(--f-latin);font-size:clamp(52px,13vw,112px);line-height:1;color:#ff5a5a;text-shadow:0 0 20px #ff2a2a,0 4px 0 #400}
.stamp small{font-weight:700;font-size:14px;color:#ffd0d0;letter-spacing:.08em}
.cutin{--ec:#fff;position:fixed;left:-10vw;right:-10vw;top:calc(50% - 13vh);height:26vh;z-index:6;pointer-events:none;overflow:hidden;
  background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 22%,#000),color-mix(in srgb,var(--ec) 55%,#000) 50%,color-mix(in srgb,var(--ec) 22%,#000));
  border-top:3px solid var(--ec);border-bottom:3px solid var(--ec);box-shadow:0 0 50px var(--ec)}
.cutin::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,#ffffff18 46px 50px);animation:speedLines .22s linear infinite}
@keyframes speedLines{to{transform:translateX(-50px)}}
.cutin .ci-k{position:absolute;left:16vw;top:50%;font-family:var(--f-display);font-size:24vh;line-height:1;color:#fff;opacity:.95;text-shadow:0 0 30px var(--ec),0 0 60px var(--ec)}
.cutin .ci-txt{position:absolute;right:14vw;top:50%;transform:translateY(-50%) skewY(7deg);text-align:right;display:grid;gap:4px;max-width:58vw}
.ci-label{font-family:"Black Ops One",var(--f-latin);letter-spacing:.45em;font-size:12px;color:#fff;opacity:.85}
.ci-name{font-size:clamp(26px,6vw,62px);color:#fff;line-height:1.05;text-shadow:0 3px 0 #000,0 0 18px var(--ec)}
.ci-sub{letter-spacing:.3em;font-size:clamp(10px,1.6vw,14px);color:#fff;opacity:.9}

/* result */
#result{background:radial-gradient(ellipse at 50% 40%,#1a1430ee,#05040af2)}
#result .inner{gap:12px}
.r-title{font-family:"Cinzel Decorative",var(--f-latin);font-weight:900;font-size:clamp(38px,9vw,68px);letter-spacing:.08em;line-height:1}
.r-title.win{background:linear-gradient(180deg,#fff8d8,#ffd34d 50%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #000) drop-shadow(0 0 20px #ffd34d88)}
.r-title.lose{color:#8a8aa0;text-shadow:0 4px 0 #000,0 0 18px #3a3a5a}
.r-title.draw{color:#cbb8ff;text-shadow:0 4px 0 #000}
#result .score{display:flex;align-items:center;gap:12px;font-size:20px}
#result .score b{font-family:"Black Ops One",var(--f-latin);font-size:34px;font-weight:400;color:#fff;min-width:2ch}
.rs-sep{color:var(--muted)}
.r-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* draft tiles read as cards */
.d-el{padding:14px 4px 12px;border-radius:12px;box-shadow:inset 0 1px 0 #ffffff14,0 6px 16px #0008}
.d-el .k{font-size:38px}
.d-eyebrow{font-family:"Black Ops One",var(--f-latin);letter-spacing:.45em}

/* 忍・竜・時 stones */
.disc[data-el="ninja"]{
  background:
    linear-gradient(135deg,transparent 46%,#7bd88f55 47% 53%,transparent 54%),
    radial-gradient(circle at 34% 28%,#4a5a8a 0%,#1d2846 50%,#0a0f1e 90%);
  box-shadow:0 0 0 1.5px #4fa868,0 0 12px #7bd88f66,0 3px 6px #000,inset 0 -4px 8px #000,inset 0 2px 5px #8aa0d055;color:#9be8a6;
}
.disc[data-el="dragon"]{
  background:
    repeating-radial-gradient(circle at 50% 120%,transparent 0 5px,#ffffff10 5px 6px),
    radial-gradient(circle at 34% 28%,#9fe0ff 0%,#2a7ad8 40%,#0a1f5a 88%);
  box-shadow:0 0 16px #3fb6ff,0 -5px 18px #3fb6ff88,0 3px 6px #000a,inset 0 -4px 8px #06123a;color:#e8f8ff;
  animation:ember 1s ease-in-out infinite alternate;
}
.disc[data-el="time"]{
  background:
    radial-gradient(circle,#2a1b06 0 6%,transparent 7%),
    conic-gradient(from 0deg,#2a1b06 0 1deg,transparent 1deg 30deg,#2a1b06 30deg 31deg,transparent 31deg 60deg,#2a1b06 60deg 61deg,transparent 61deg 90deg,#2a1b06 90deg 91deg,transparent 91deg 120deg,#2a1b06 120deg 121deg,transparent 121deg 150deg,#2a1b06 150deg 151deg,transparent 151deg 180deg,#2a1b06 180deg 181deg,transparent 181deg 210deg,#2a1b06 210deg 211deg,transparent 211deg 240deg,#2a1b06 240deg 241deg,transparent 241deg 270deg,#2a1b06 270deg 271deg,transparent 271deg 300deg,#2a1b06 300deg 301deg,transparent 301deg 330deg,#2a1b06 330deg 331deg,transparent 331deg),
    radial-gradient(circle at 40% 35%,#fffdf0 0%,#efe2b8 55%,#c8a96a 80%,#8a6420 92%);
  box-shadow:0 0 0 2px #b8862e,0 0 12px #e6c26a88,0 3px 6px #000a;color:#5a3e08;
}
.aura[data-el="ninja"]{inset:-16%;background:linear-gradient(135deg,#e8ecf4,#7a8090);clip-path:polygon(50% 0,57% 43%,100% 50%,57% 57%,50% 100%,43% 57%,0 50%,43% 43%);opacity:.6;animation:auraSpin 2.4s linear infinite}
.dragonfly,.ninjafly{will-change:transform}
.ninjafly{position:fixed;left:0;top:0;z-index:5;pointer-events:none;filter:drop-shadow(0 0 6px #7bd88f88)}
.ninjafly svg{width:100%;height:auto;display:block}
.scene.kuji{display:grid;place-items:center;background:radial-gradient(circle,#0a160ecc,#000c 70%)}
.scene.kuji .kj{font-family:"Yuji Syuku","Yuji Boku",serif;font-size:min(46vw,46vh);line-height:1;color:#e8f5e0;text-shadow:0 0 30px #7bd88f,0 0 60px #2b3a67,0 6px 0 #000}
.aura[data-el="dragon"]{inset:-16% 6% 22% 6%;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse 50% 60% at 50% 75%,#bff0ffcc,#3fb6ff77 45%,transparent 72%);filter:blur(2px);transform-origin:50% 100%;animation:flicker .3s steps(2) infinite alternate}
.aura[data-el="dragon"]::before,.aura[data-el="dragon"]::after{content:"";position:absolute;bottom:20%;width:42%;height:120%;border-radius:50% 50% 30% 30%/70% 70% 30% 30%;background:radial-gradient(ellipse 50% 70% at 50% 90%,#ffffff,#3fb6ff 40%,#1a3fa0aa 65%,transparent 80%);filter:blur(1.5px);transform-origin:50% 100%}
.aura[data-el="dragon"]::before{left:6%;animation:tongue .55s ease-in-out infinite alternate}
.aura[data-el="dragon"]::after{right:6%;animation:tongue .7s ease-in-out infinite alternate-reverse}
.aura[data-el="time"]{inset:-7%;background:repeating-conic-gradient(#e6c26a99 0 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 44%,#000 52%,transparent 64%);mask:radial-gradient(circle,transparent 44%,#000 52%,transparent 64%);animation:auraSpin 12s linear infinite reverse}
.disc[data-el="ninja"][data-alt]{background:radial-gradient(circle at 34% 28%,#8a8f2a 0%,#3a4012 50%,#141606 90%);box-shadow:0 0 0 1.5px #c7d84a,0 0 12px #c7d84a66,0 3px 6px #000}
.disc[data-el="dragon"][data-alt]{background:radial-gradient(circle at 34% 28%,#c8b8ff 0%,#5a4ad8 40%,#1a0f5a 88%);box-shadow:0 0 16px #7a6cff,0 3px 6px #000a}
.disc[data-el="time"][data-alt]{background:radial-gradient(circle,#0a2240 0 6%,transparent 7%),radial-gradient(circle at 40% 35%,#ffffff 0%,#d8ecff 55%,#7aa8d8 90%);box-shadow:0 0 0 2px #5a8ac8,0 0 12px #9ad0ff88,0 3px 6px #000a}

/* sealed squares: 蒼炎 lines and rewound clock squares */
.flame.blaze{background:radial-gradient(ellipse 60% 85% at 50% 96%,#ffffff 0%,#bff0ff 22%,#3fb6ff 48%,#1a3fa0 70%,transparent 86%),#06123a;box-shadow:0 0 22px #3fb6ff,0 0 40px #1a3fa099,inset 0 0 14px #9fe0ff}
.flame.blaze::before,.flame.blaze::after{background:radial-gradient(ellipse 50% 70% at 50% 90%,#ffffff,#3fb6ff 40%,#1a3fa0aa 65%,transparent 82%)!important}
.flame.clock{background:radial-gradient(circle,#2a1b06 0 8%,transparent 9%),conic-gradient(from 0deg,#e6c26a 0 90deg,#3a2c10 90deg 360deg);box-shadow:0 0 14px #e6c26a,inset 0 0 0 3px #b8862e;animation:none;place-items:center;font-family:"DotGothic16",monospace;color:#fff8e0;text-shadow:0 0 4px #000}
.flame.clock::before,.flame.clock::after{content:none}

/* flying dragon, scenes */
.dragonfly{position:fixed;left:0;top:0;z-index:5;pointer-events:none;filter:drop-shadow(0 0 18px #3fb6ff) drop-shadow(0 0 40px #1a3fa0)}
.dragonfly svg{width:100%;height:auto;display:block}
.scene{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0}
.scene.bamboo svg{position:absolute;inset:0;width:100%;height:100%}
.scene.bamboo .stalk,.scene.bamboo .stop{transform-box:fill-box;transform-origin:50% 100%}
.scene.clockov{display:grid;place-items:center}
.scene.clockov svg{width:min(70vw,70vh);height:auto;filter:drop-shadow(0 10px 30px #000) drop-shadow(0 0 30px #e6c26a88)}
.scene.clockov .hh,.scene.clockov .mh,.scene.clockov .sh{transform-box:view-box;transform-origin:100px 100px}
.scene.clockov .g1{transform-box:view-box;transform-origin:20px 175px}
.scene.clockov .g2{transform-box:view-box;transform-origin:185px 20px}
.disc.flyaway{position:fixed;z-index:5;pointer-events:none}
.stamp.trap{border-color:#7bd88f;background:#06140bcc;box-shadow:0 0 30px #7bd88f66,inset 0 0 20px #7bd88f44}
.stamp.trap span{font-family:"Yuji Syuku","Yuji Boku",serif;color:#c8ffd4;text-shadow:0 0 20px #4fa868,0 4px 0 #06140b}
.stamp.trap small{color:#d8ffe0}

/* aiming in two steps */
.cell.aimfirst{box-shadow:inset 0 0 0 3px #fff,0 0 16px #ffffffaa!important}
.hud-right{display:flex;gap:8px}

/* fire stones under 烈火出陣 burn harder */
.cell.guard .aura[data-el="fire"]{inset:-34% -2% 16% -2%;filter:blur(1px) brightness(1.3)}
.cell.guard .disc[data-el="fire"]{box-shadow:0 0 22px #ff8a1f,0 -8px 26px #ff5a1fcc,0 3px 6px #000a,inset 0 -4px 8px #5a0500}

/* element tiles in the draft carry a light version of their effect */
.d-el{position:relative;overflow:hidden;isolation:isolate}
.d-el > span{position:relative;z-index:1}
.d-el::before{content:"";position:absolute;inset:-40%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--ec) 40%,transparent),transparent 55%);animation:tilePulse 2.6s ease-in-out infinite}
@keyframes tilePulse{50%{opacity:.45;transform:scale(1.15)}}
.d-el[data-el="dark"]::before{background:conic-gradient(from 0deg,transparent,#a259ff55,transparent 40%,#4b12a077,transparent 80%);animation:auraSpin 4s linear infinite}
.d-el[data-el="light"]::before{background:repeating-conic-gradient(#fff3c044 0 6deg,transparent 6deg 30deg);animation:auraSpin 14s linear infinite}
.d-el[data-el="fire"]::before{background:radial-gradient(ellipse 40% 60% at 50% 100%,#ff8a1f99,transparent 70%);animation:flicker .3s steps(2) infinite alternate;transform-origin:50% 100%}
.d-el[data-el="thunder"]::before{background:radial-gradient(circle,#ffe60055,transparent 55%);animation:charged 1.4s steps(1) infinite}
.d-el[data-el="star"]::before{background:radial-gradient(circle at 25% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 25%,#ffd86a 0 1px,transparent 2px),radial-gradient(circle at 60% 70%,#fff 0 1px,transparent 2px),radial-gradient(circle at 35% 75%,#9db8ff 0 1px,transparent 2px);inset:0;animation:tilePulse 1.8s ease-in-out infinite}
.d-el[data-el="king"]::before{background:linear-gradient(105deg,transparent 35%,#ffd34d55 50%,transparent 65%);inset:0;animation:cardShine 2.4s ease-in-out infinite}
.d-el[data-el="rock"]::before{background:radial-gradient(circle at 50% 110%,#c9a46a55,transparent 60%)}
.d-el[data-el="ninja"]::before{background:repeating-linear-gradient(90deg,transparent 0 16px,#4fa86833 16px 20px);animation:none}
.d-el[data-el="dragon"]::before{background:radial-gradient(ellipse 40% 60% at 50% 100%,#3fb6ff99,transparent 70%);animation:flicker .32s steps(2) infinite alternate;transform-origin:50% 100%}

/* wyvern rig */
.dragonfly .wing{transform-box:view-box;transform-origin:152px 97px}
.dragonfly .head{transform-box:view-box;transform-origin:222px 64px}
.dragonfly .jaw{transform-box:view-box;transform-origin:234px 71px}
.dragonfly.roaring{z-index:6;filter:drop-shadow(0 0 30px #3fb6ff) drop-shadow(0 20px 40px #000)}

/* skill detail panel */
.card,.pas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.si-panel{--ec:#fff;border-color:color-mix(in srgb,var(--ec) 70%,#8a7444);box-shadow:0 20px 60px #000c,0 0 30px -6px var(--ec),inset 0 1px 0 #ffffff14}
.si-kind{font-size:11px;letter-spacing:.18em;color:var(--muted)}
.si-name{font-size:26px;line-height:1.2;text-shadow:0 0 14px color-mix(in srgb,var(--ec) 60%,transparent)}
.si-state{font-size:13px;font-weight:700;color:#ffd08a;font-variant-numeric:tabular-nums}
.si-desc{margin:0;font-size:14px;line-height:1.75;color:var(--ink)}
@media (max-width:520px){
  .card .c-top > span:first-child::after,.pas .p-top > span:first-child::after{content:"・長押しで詳細";color:#cbb8ff;letter-spacing:.04em}
}

/* 鬼 stones: crimson lacquer with a black 鬼 crest, licked by red flame */
.disc[data-el="oni"]{
  background:radial-gradient(circle at 34% 28%,#ff7a5a 0%,#d4141a 38%,#6a0008 78%,#1a0004 94%);
  box-shadow:0 0 0 1.5px #2a0004,0 0 14px #ff1a1a99,0 -4px 16px #ff3a1a55,0 3px 6px #000,inset 0 -4px 8px #1a0004,inset 0 2px 5px #ffb09a66;
  color:#14000a;animation:oniThrob 1.6s ease-in-out infinite;
}
.disc[data-el="oni"]::after{opacity:.6;mix-blend-mode:normal;text-shadow:0 0 4px #ff6a3a}
@keyframes oniThrob{50%{box-shadow:0 0 0 1.5px #2a0004,0 0 22px #ff1a1a,0 -6px 22px #ff3a1a88,0 3px 6px #000,inset 0 -4px 8px #1a0004,inset 0 2px 5px #ffb09a66}}
.aura[data-el="oni"]{inset:-16% 6% 22% 6%;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse 50% 60% at 50% 75%,#ffd0a0cc,#ff1a1a77 45%,transparent 72%);filter:blur(2px);transform-origin:50% 100%;animation:flicker .3s steps(2) infinite alternate}
.aura[data-el="oni"]::before,.aura[data-el="oni"]::after{content:"";position:absolute;bottom:20%;width:42%;height:120%;border-radius:50% 50% 30% 30%/70% 70% 30% 30%;background:radial-gradient(ellipse 50% 70% at 50% 90%,#fff0e0,#ff3a1a 40%,#6a0008aa 65%,transparent 80%);filter:blur(1.5px);transform-origin:50% 100%}
.aura[data-el="oni"]::before{left:6%;animation:tongue .55s ease-in-out infinite alternate}
.aura[data-el="oni"]::after{right:6%;animation:tongue .7s ease-in-out infinite alternate-reverse}
.disc[data-el="oni"][data-alt]{background:radial-gradient(circle at 34% 28%,#ffb0e0 0%,#c01a8a 40%,#3a0028 88%);box-shadow:0 0 0 1.5px #2a0018,0 0 14px #ff4da699,0 3px 6px #000}

/* 鋼 stones: brushed, polished steel with a sheen that runs round the rim */
.disc[data-el="steel"]{
  background:
    radial-gradient(circle,transparent 0 55%,#2a3038 56% 58%,transparent 59%),
    repeating-linear-gradient(90deg,#ffffff14 0 1px,transparent 1px 3px),
    conic-gradient(from 210deg,#f4f7fb,#8a96a6 18%,#e2e8f0 34%,#5b6878 52%,#d8e0ea 70%,#7a8696 86%,#f4f7fb);
  box-shadow:0 0 0 1.5px #2a3038,0 0 10px #8fd0ff55,0 3px 6px #000c,inset 0 -3px 6px #1a1e24aa,inset 0 2px 4px #ffffffaa;
  color:#1a1e24;
}
.disc[data-el="steel"]::after{opacity:.6;mix-blend-mode:normal;text-shadow:0 1px 0 #ffffff99}
.aura[data-el="steel"]{inset:-5%;background:conic-gradient(from 0deg,transparent 0 78%,#ffffffdd 86%,#8fd0ff88 90%,transparent 96%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 62%,transparent 70%);mask:radial-gradient(circle,transparent 58%,#000 62%,transparent 70%);animation:auraSpin 2.8s linear infinite}
.disc[data-el="steel"][data-alt]{background:radial-gradient(circle,transparent 0 55%,#12203a 56% 58%,transparent 59%),conic-gradient(from 210deg,#e8f2ff,#4a6a9a 18%,#c8dcf5 34%,#2a4068 52%,#b8d0ee 70%,#3a5880 86%,#e8f2ff);box-shadow:0 0 0 1.5px #12203a,0 0 10px #8fd0ff88,0 3px 6px #000c}

/* stones taken by 堅牢の極意 sit in a riveted steel frame; stones touching it rust */
.cell.steel::before{content:"";position:absolute;inset:2%;z-index:3;pointer-events:none;border-radius:16%;
  background:radial-gradient(circle at 11% 11%,#fff 0 1.5px,#7a8696 2px 3.5px,transparent 4px),radial-gradient(circle at 89% 11%,#fff 0 1.5px,#7a8696 2px 3.5px,transparent 4px),
    radial-gradient(circle at 11% 89%,#fff 0 1.5px,#7a8696 2px 3.5px,transparent 4px),radial-gradient(circle at 89% 89%,#fff 0 1.5px,#7a8696 2px 3.5px,transparent 4px);
  border:3px solid #a8b4c4;box-shadow:inset 0 0 0 1px #2a3038,0 0 0 1px #2a3038,inset 0 0 10px #8fd0ff66,0 0 10px #8fd0ff55}
.cell.steel .disc{box-shadow:0 0 0 2px #e2e8f0,0 0 14px #8fd0ff,0 3px 6px #000c!important}
.cell.rusted .disc{filter:sepia(.85) saturate(1.6) hue-rotate(-18deg) brightness(.8);box-shadow:inset 0 0 0 3px #8a4a1a,0 0 10px #c0601a!important}
.cell.rusted::before{content:"錆";position:absolute;right:1px;top:-2px;z-index:5;font-family:var(--f-display);font-size:clamp(9px,1.8vw,14px);color:#ffd0a0;text-shadow:0 0 6px #c0601a,0 0 2px #000;pointer-events:none}
#board.blind .cell.steel::before,#board.blind .cell.rusted::before{display:none}

/* draft tiles */
.d-el[data-el="oni"]::before{background:radial-gradient(ellipse 40% 60% at 50% 100%,#ff1a1a99,transparent 70%);animation:flicker .3s steps(2) infinite alternate;transform-origin:50% 100%}
.d-el[data-el="steel"]::before{background:linear-gradient(105deg,transparent 35%,#ffffff66 50%,transparent 65%),repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 3px);inset:0;animation:cardShine 1.8s ease-in-out infinite}

/* oni mask, iron club, steel plates and shutters */
.onimask{position:fixed;z-index:6;pointer-events:none;filter:drop-shadow(0 0 24px #ff1a1a) drop-shadow(0 16px 30px #000)}
.onimask svg{width:100%;height:auto;display:block}
.onimask .glint{transform-box:fill-box;transform-origin:center;opacity:0}
.onimask .maw{opacity:.2}
.onimask.parade{z-index:5;opacity:.9}
.onimask,.kanabo,.steelplate{will-change:transform}
.kanabo{position:fixed;z-index:6;pointer-events:none;transform-origin:50% 98%;filter:drop-shadow(0 0 10px #ff1a1a) drop-shadow(0 12px 18px #000)}
.kanabo svg{width:100%;height:100%;display:block}
.steelplate{position:fixed;z-index:5;pointer-events:none;filter:drop-shadow(0 6px 10px #000) drop-shadow(0 0 10px #8fd0ff88)}
.steelplate svg{width:100%;height:100%;display:block}
.scene.shutter{opacity:1;overflow:hidden}
.scene.shutter .sh{position:absolute;left:0;right:0;height:50.5%;box-shadow:0 0 40px #000;
  background:radial-gradient(circle,#ffffff 0 2px,#7a8696 3px 5px,#1a1e24 6px,transparent 7px) 22px 18px/90px 70px,
    repeating-linear-gradient(0deg,transparent 0 22px,#0006 22px 24px,#fff2 24px 25px),
    linear-gradient(180deg,#d8e0ea,#8a96a6 40%,#5b6878 60%,#c0ccd8)}
.scene.shutter .top{top:0;transform:translateY(-102%);border-bottom:12px solid #ffc400;border-image:repeating-linear-gradient(45deg,#ffc400 0 16px,#141414 16px 32px) 12}
.scene.shutter .bot{bottom:0;transform:translateY(102%);border-top:12px solid #ffc400;border-image:repeating-linear-gradient(45deg,#ffc400 0 16px,#141414 16px 32px) 12}
.scene.shutter .sh-k{position:absolute;left:50%;top:50%;opacity:0;font-family:"Train One","Dela Gothic One",sans-serif;font-size:min(42vw,42vh);line-height:1;color:#e8eef5;-webkit-text-stroke:3px #2a3038;text-shadow:0 0 30px #8fd0ff,0 8px 0 #1a1e24}

/* VS banner when both players are in the room */
.vsban{position:fixed;left:0;right:0;top:calc(50% - 40px);z-index:7;pointer-events:none;display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,24px);padding:16px;
  background:linear-gradient(90deg,transparent,#0a0614e6 18%,#0a0614e6 82%,transparent);border-top:1px solid #ffd34d88;border-bottom:1px solid #ffd34d88;
  font-family:var(--f-display);font-size:clamp(20px,5vw,36px);color:#fff}
.vsban span{max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 0 12px #cbb8ff}
.vsban b{font-family:"Black Ops One",var(--f-latin);font-weight:400;font-size:1.3em;color:#ffd34d;text-shadow:0 0 16px #ffd34d,0 3px 0 #000}

/* profile */
#settings .m-panel{max-height:calc(100vh - 32px);overflow:auto}
.prof{display:grid;gap:8px;padding-bottom:8px;border-bottom:1px solid #ffffff10}
.prof input,.prof select{width:150px;padding:8px 10px;border-radius:8px;border:1px solid #8a744499;background:#0f0b1a;color:var(--ink);font:inherit;font-size:14px}
.prof input:focus,.prof select:focus{outline:2px solid #cbb8ff;outline-offset:1px}
.p-wins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.p-win{--ec:#fff;display:grid;justify-items:center;gap:1px;padding:6px 2px;border-radius:8px;background:#0f0b1acc;border:1px solid #ffffff14;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.p-win b{font-family:var(--f-display);font-size:20px;line-height:1.1;font-weight:400;color:var(--ec);text-shadow:0 0 8px color-mix(in srgb,var(--ec) 60%,transparent)}
.p-win strong{color:var(--ink);font-size:13px}
.p-win.fav{border-color:#ffd34d;box-shadow:0 0 10px #ffd34d55}
.p-total{font-size:12px;color:var(--muted)}
.t-player{font-size:13px;color:#e8dcff;min-height:1.3em;margin-top:-4px}
#tResume small{display:block;font-size:11px;opacity:.85}
.d-el.fav::after{content:"★";position:absolute;top:3px;right:6px;z-index:2;color:#ffd34d;font-size:13px;text-shadow:0 0 6px #ffd34d}

/* 省ドパモード: keep the game, drop the spectacle */
html.lite .aura,html.lite #aura{display:none!important}
html.lite .flame:not(.chain)::before,html.lite .flame:not(.chain)::after{animation:none!important}

@media (max-width:860px){

}

const cells = [], discs = [];

/* ---------- rules ---------- */

{ let k=64; for (let r=-1;r<=8;r++) for (let c=-1;c<=8;c++){ if (r>=0&&r<8&&c>=0&&c<8) continue; RC[k]=[r,c]; GRID[(r+1)*10+(c+1)]=k; k++; } }
const idxAt = (r,c) => GRID[(r+1)*10+(c+1)];
const at = (b,r,c) => (r<-1||r>8||c<-1||c>8) ? undefined : b[idxAt(r,c)];
// guards, steel and every king not under a star seal: stones that can never be flipped.
// Rusted stones ride along as {idx,rust:owner}: they can be flipped, but their owner cannot sandwich with them.
function protOf(gs,ks,hs,st,rs){
  const out=gs.slice();
  if (ks) for (const q of [1,2]){ const k=ks[q]; if (k>=0 && !(hs && hs.p===q)) out.push({idx:k,owner:q}); }
  if (st) for (const x of st) out.push({idx:x.idx,owner:x.owner});
  if (rs) for (const x of rs) out.push({idx:x.idx,rust:x.owner});
  return out;
}
function flipsFor(b, i, p, gs=prot){
  if (b[i]!==0) return [];
  const o = 3-p, [r,c] = RC[i], out = [];
  for (const [dr,dc] of D8){
    let rr=r+dr, cc=c+dc, v; const tmp=[];
    while ((v=at(b,rr,cc))===o){ tmp.push(idxAt(rr,cc)); rr+=dr; cc+=dc; }
    if (tmp.length && v===p && !gs.some(g=>g.rust===p && g.idx===idxAt(rr,cc))) for (const k of tmp) if (k<64 && !gs.some(g=>g.idx===k && g.owner===o)) out.push(k);

}

  if (cfg.el[p]==='rock' && !(hs && hs.p===p)) for (let i=64;i<N;i++) if (b[i]===0 && flipsFor(b,i,p,gs).length) m.push(i);

}
function counts(b){ let a=0,w=0,e=0; for (let i=0;i<b.length;i++){ const v=b[i]; if(v===1)a++; else if(v===2)w++; else if(v===0 && i<64) e++; } return [a,w,e]; }

/* ---------- CPU ---------- */
const WT = [
 120,-20,20, 5, 5,20,-20,120,
 -20,-40,-5,-5,-5,-5,-40,-20,
  20, -5,15, 3, 3,15, -5, 20,
   5, -5, 3, 3, 3, 3, -5,  5,
   5, -5, 3, 3, 3, 3, -5,  5,
  20, -5,15, 3, 3,15, -5, 20,

 120,-20,20, 5, 5,20,-20,120];
function evalB(b,p){
  const o=3-p; let s=0,e=0,d=0;
  for(let i=0;i<64;i++){ const v=b[i]; if(v===p){s+=WT[i];d++;} else if(v===o){s-=WT[i];d--;} else e++; }
  if (e<=14) s += d*(16-e)*2;
  s += (legal(b,p).length - legal(b,o).length)*5;
  return s;
}
function negamax(b,p,depth,a,beta,passed){
  if (depth===0) return evalB(b,p);
  const ms = legal(b,p);
  if (!ms.length){
    if (passed){ let d=0; for(const v of b){ if(v===p)d++; else if(v===3-p)d--; } return d*1000; }
    return -negamax(b,3-p,depth-1,-beta,-a,true);
  }
  ms.sort((x,y)=>W8(y)-W8(x));
  let best=-1e9;
  for (const m of ms){
    const nb=b.slice(); const f=flipsFor(nb,m,p); nb[m]=p; for(const k of f) nb[k]=p;
    const v=-negamax(nb,3-p,depth-1,-beta,-a,false);
    if (v>best) best=v; if (v>a) a=v; if (a>=beta) break;
  }
  return best;
}
function cpuPick(b,p){
  const ms = legal(b,p); if(!ms.length) return -1;
  const empties = counts(b)[2];
  const depth = cfg.lv==1 ? 1 : cfg.lv==2 ? 3 : (empties<=9 ? empties : 5);
  let best=-1e9, pick=ms[0];
  for (const m of ms){
    const nb=b.slice(); const f=flipsFor(nb,m,p); nb[m]=p; for(const k of f) nb[k]=p;
    let v = -negamax(nb,3-p,depth-1,-1e9,1e9,false);
    if (cfg.lv==1) v += Math.random()*60;
    if (v>best){ best=v; pick=m; }
  }
  return pick;
}

      const comp = AC.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=6;

}

addEventListener('resize', resize); resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[(Math.random()*arr.length)|0];
const MAXP=2600;
const P=[], RINGS=[], BOLTS=[], BEAMS=[], CIRCLES=[], HOLES=[], EMIT=[], LINES=[];
function part(o){ if(P.length>=MAXP || (cfg.lite && Math.random()>.1)) return; P.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,drag:.97,life:1,t:0,size:3,color:'#fff',mode:'glow',tw:0},o)); }

function makeBolt(x1,y1,x2,y2,disp){
  let pts=[[x1,y1],[x2,y2]]; let d=disp ?? Math.hypot(x2-x1,y2-y1)/4.5;
  for(let it=0;it<6;it++){ const np=[pts[0]]; for(let i=1;i<pts.length;i++){ const [ax,ay]=pts[i-1],[bx,by]=pts[i]; np.push([(ax+bx)/2+rnd(-d,d),(ay+by)/2+rnd(-d,d)],[bx,by]); } pts=np; d/=2; }
  return pts;
}
function bolt(x1,y1,x2,y2,color,life=.3,w=1.4,branches=2){
  const b={x1,y1,x2,y2,color,life,t:0,w,nb:branches,paths:[],rj:0};
  rebolt(b); BOLTS.push(b);
}
function rebolt(b){
  const main=makeBolt(b.x1,b.y1,b.x2,b.y2); b.paths=[main];
  for(let k=0;k<b.nb;k++){ const p=main[(Math.random()*main.length*.8)|0]; const a=Math.atan2(b.y2-b.y1,b.x2-b.x1)+rnd(-1,1); const L=Math.hypot(b.x2-b.x1,b.y2-b.y1)*rnd(.15,.4); b.paths.push(makeBolt(p[0],p[1],p[0]+Math.cos(a)*L,p[1]+Math.sin(a)*L)); }
}

  if (s<W+H) return [W+rnd(-m,m), s-W];

let lastT=performance.now();
function loop(now){
  lastFrameAt=performance.now();
  try { frame(now); } catch(e){ console.error(e); cx.restore && cx.setTransform(DPR,0,0,DPR,0,0); }
  requestAnimationFrame(loop);
}
function frame(now){
  cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
  if (cfg.lite){ BEAMS.length=0; CIRCLES.length=0; HOLES.length=0; BOLTS.length=0; }
  let dt=Math.min(.08,(now-lastT)/1000); lastT=now;
  // emitters
  for(let i=EMIT.length-1;i>=0;i--){ const e=EMIT[i]; e.t+=dt; e.fn(dt,e.t); if(e.t>=e.dur) EMIT.splice(i,1); }
  ambientTick(dt);
  // shake
  if (shakeMag>.4){ stage.style.transform=`translate(${rnd(-1,1)*shakeMag}px,${rnd(-1,1)*shakeMag}px) rotate(${rnd(-1,1)*shakeMag*.03}deg)`; shakeMag*=Math.exp(-dt*5.5); }
  else if (shakeMag){ shakeMag=0; stage.style.transform=''; }

  cx.clearRect(0,0,W,H);
  // particles update
  for(let i=P.length-1;i>=0;i--){
    const p=P[i]; p.t+=dt;
    if (p.t>=p.life){ P.splice(i,1); continue; }
    if (p.attract){ const dx=p.attract.x-p.x, dy=p.attract.y-p.y, d=Math.hypot(dx,dy)||1; p.vx+=dx/d*p.attract.s*dt*60; p.vy+=dy/d*p.attract.s*dt*60; if(d<14){ P.splice(i,1); continue; } }
    if (p.wob) p.vx+=Math.sin(p.t*p.wob+p.y*.02)*12*dt*60*.05;
    p.vy+=p.g*dt; const dr=Math.pow(p.drag,dt*60); p.vx*=dr; p.vy*=dr;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  // smoke (darkening) pass
  cx.globalCompositeOperation='source-over';
  for(const p of P){ if(p.mode!=='smoke') continue; const k=p.t/p.life; cx.globalAlpha=(1-k)*(p.alpha??.5); cx.fillStyle=p.color; cx.beginPath(); cx.arc(p.x,p.y,p.size*(1+k*1.6),0,TAU); cx.fill(); }
  for(const p of P){ if(p.mode==='ghost') drawGhost(p); }
  for(const p of P){
    if (p.mode!=='chunk' && p.mode!=='coin' && p.mode!=='shuriken' && p.mode!=='leaf' && p.mode!=='kunai' && p.mode!=='gear') continue;
    const k=p.t/p.life; cx.globalAlpha=Math.min(1,(1-k)*2); cx.save(); cx.translate(p.x,p.y); cx.rotate((p.rot||0)+p.t*(p.spin||6));
    if (p.mode==='coin'){ cx.scale(Math.cos(p.t*9+(p.rot||0)),1); cx.fillStyle=p.color; cx.beginPath(); cx.arc(0,0,p.size,0,TAU); cx.fill(); cx.strokeStyle='#7a5410'; cx.lineWidth=Math.max(.5,p.size*.2); cx.stroke(); }
    else if (p.mode==='shuriken'){ cx.fillStyle=p.color; cx.beginPath(); for (let j=0;j<8;j++){ const rr=j%2?p.size*.28:p.size, an=j*Math.PI/4; cx.lineTo(Math.cos(an)*rr,Math.sin(an)*rr); } cx.closePath(); cx.fill(); cx.fillStyle='#16161c'; cx.beginPath(); cx.arc(0,0,p.size*.18,0,TAU); cx.fill(); }

// every key is listed so an online state merge overwrites last game's values instead of keeping them

function fireReadyIn(p){
  const s=pas[p]||{}, t=s.turns||0;
  if (t<FIRE_OPEN) return FIRE_OPEN-t;
  return Math.max(0, FIRE_CD-(t-(s.fireAt??-99)));
}
const PHASES=['序盤','中盤','終盤'];
const phaseOf = e => e>40 ? 0 : e>20 ? 1 : 2;
const royalDone = p => (pas[p] && pas[p].royal) || [];
const cardLeft = p => cfg.el[p]==='fire' ? (fireReadyIn(p)===0 ? 1 : 0)
  : cfg.el[p]==='king' ? (royalDone(p).includes(phaseOf(emptyCount())) ? 0 : 1)
  : Math.max(0, cardOf(p).uses - (used[p]||0));

  if (el==='fire') return '5ターンに1回';

  return `残り ${cardLeft(p)} / ${cardOf(p).uses}`;
}
const cardOpenAt = el => el==='thunder' ? LATE+THUNDER_EARLY : el==='king' ? LATE+KING_EARLY : el==='dragon' ? DRAGON_OPEN : el==='time' ? TIME_OPEN : LATE;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
// opponent stones on the 8x8 a card may touch, and how many it would actually hit (never the last one)
function skillTargets(b,p,gs,el){

  for (let i=0;i<64;i++) if (b[i]===opp){ oc++; if (!gs.some(g=>g.idx===i && g.owner===opp)) os.push(i); }

  for (let dr=-1;dr<=1;dr++) for (let dc=-1;dc<=1;dc++){ const rr=r+dr, c2=cc+dc; if (rr<0||rr>7||c2<0||c2>7) continue; const k=rr*8+c2; if (b[k]===3-p && !gs.some(g=>g.idx===k && g.owner===3-p)) out.push(k); }
  return out;
}
function oniBest(b,p,gs){ let best=-1, n=0; for (let i=0;i<64;i++){ const m=oniBlock(b,i,p,gs).length; if (m>n){ n=m; best=i; } } return {best,n}; }

function steelPool(b,p,gs){ const out=[]; for (let i=0;i<64;i++) if (b[i]===3-p && !gs.some(g=>g.idx===i && g.owner===3-p)) out.push(i); return out; }

function cardBlock(p){

  if (el==='fire'){
    const t=(pas[p]&&pas[p].turns)||0, r=fireReadyIn(p);
    if (t<FIRE_OPEN) return `炎の手番があと${FIRE_OPEN-t}回で使用可能`;
    if (r>0) return `再使用まであと${r}ターン`;
  } else if (el==='ninja'){
    const t=(pas[p]&&pas[p].turns)||0;
    if (cardLeft(p)<=0) return '使い切りました';
    if (t<NINJA_OPEN) return `忍の手番があと${NINJA_OPEN-t}回で使用可能`;
    if (emptyCount()<=LATE) return '前半のみ使用可能（後半に入りました）';
  } else if (el==='king'){

// 威光の王家: enemy stones on all four sides and two of the corners take the castle;
// eight friends round it win the kingdom outright
function checkRegicide(S){

    const [r,c]=RC[idx];
    if ((S.steel||[]).some(x=>x.owner===3-p && S.board[x.idx]===3-p && Math.max(Math.abs(RC[x.idx][0]-r),Math.abs(RC[x.idx][1]-c))===1)){

    if (el==='light' && !ps.seraph && ps.flips>=20){ ps.seraph=true; S.ev.push('seraph:'+p); }
    if (el==='fire'){ S.guards.push({idx,owner:p,left:2}); S.ev.push('guard:'+idx); }
    if (el==='dark' && f.length>=4){ S.blind=3-p; S.ev.push('ghost:'+(3-p)); }

    if (el==='king' && S.kings[p]===-1){ S.kings[p]=idx; S.ev.push('crown:'+idx); }

    for (const [dr,dc] of D8){ const rr=r+dr, cc=c+dc; if (rr<0||rr>7||cc<0||cc>7) continue; const a=rr*8+cc; if (S.board[a]>0 && !pr.some(g=>g.idx===a && g.owner===S.board[a])) around.push(a); }

/* ---------- casting a card ---------- */
async function castCard(p, target, remoteS, remoteTargets){
  const myGen=gen, el=cfg.el[p];
  let S, targets;
  if (remoteS){ S=remoteS; targets=remoteTargets||[]; }
  else {
    S=curState();
    const pr=protS(S);
    if (el==='light'||el==='dark'){
      const {os,n}=skillTargets(S.board,p,pr,el);
      targets=shuffle(os).slice(0,n);
      targets.forEach(i=>S.board[i] = el==='light' ? 0 : p);
      if (el==='dark') targets.forEach(i=>S.curses.push({idx:i,owner:p,left:1}));
    }
    else if (el==='fire'){ targets=[target]; S.burns.push({idx:target,owner:p,left:3}); S.pas[p].fireAt=S.pas[p].turns; }
    else if (el==='star'){
      targets=[]; const changed=[];
      const empt=[]; for (let i=0;i<64;i++) if (S.board[i]===0 && !S.burns.some(b=>b.idx===i)) empt.push(i);
      for (const e of shuffle(empt).slice(0,3)){
        const f=flipsFor(S.board,e,p,protS(S)); S.board[e]=p; f.forEach(k=>S.board[k]=p);
        targets.push(e,...f,-1); changed.push(e,...f);
      }
      const {os}=skillTargets(S.board,p,protS(S),'star');
      let oc=0; for (let i=0;i<64;i++) if (S.board[i]===3-p) oc++;
      if (os.length && oc>1){ const cv=pick(os); S.board[cv]=p; targets.push(cv); changed.push(cv); }
      starPassive(S,p,changed);
    }
    else if (el==='king'){ targets=[]; S.royal=p; S.pas[p].royal=[...(S.pas[p].royal||[]), phaseOf(counts(S.board)[2])]; }
    else if (el==='rock'){ targets=[]; S.quake=1; }
    else if (el==='ninja'){ const [a,b]=target; targets=[a,b]; S.board[a]=3-p; S.board[b]=p; }
    else if (el==='dragon'){
      const pr=protS(S); targets=target.slice();
      for (const i of targets){
        if (S.board[i]>0 && !pr.some(g=>g.idx===i && g.owner===S.board[i])) S.board[i]=0;
        if (S.board[i]===0){ S.burns=S.burns.filter(b=>b.idx!==i); S.burns.push({idx:i,owner:0,left:2,kind:'blaze',fresh:true}); }
      }
    }
    else if (el==='oni'){
      const conv=oniBlock(S.board,target,p,pr); targets=[target,...conv];
      conv.forEach(i=>S.board[i]=p); S.pas[p].rest=3;
    }
    else if (el==='steel'){
      targets=target.filter(i=>i>=0 && i<64 && S.board[i]===3-p && !pr.some(g=>g.idx===i && g.owner===3-p));
      S.steel=S.steel||[]; targets.forEach(i=>{ S.board[i]=p; S.steel.push({idx:i,owner:p}); });
    }
    else if (el==='time'){
      const lp=S.lastPlace; targets=[lp.idx];
      S.board=lp.before.slice(); S.lastPlace=null;
      S.burns=S.burns.filter(b=>b.idx!==lp.idx); S.burns.push({idx:lp.idx,owner:p,left:1,kind:'clock'});
    }
    else { targets=[]; S.extra=1; }
    S.used[p]=(S.used[p]||0)+1; S.cardThisTurn=true; S.pass=0;
    cleanupS(S);
    if (!checkRegicide(S) && !legalS(S,p).length){
      S.extra=0; advanceS(S,p);
      if (!S.over && S.turn!==p && !S.pass) S.pass=p;
    }
    sendState(S,['card',p,el,...targets]);
  }
  busy=true; aim=0; render();
  await playCard(el,p,targets,myGen);
  if (myGen!==gen) return;
  busy=false;
  commit(S);
}

async function playEvents(ev){
  for (const e of ev){
    const [k,v,extra]=e.split(':'); const n=+v;
    if (!Number.isInteger(n)) continue;
    if (k==='seraph' && (n===1||n===2)) await fxSeraph(n);
    else if (k==='guard' && n>=0 && n<N) await fxGuard(n);
    else if (k==='ghost' && (n===1||n===2)) await fxGhost(n);
    else if (k==='chain' && n>=0 && n<64) await fxChain(n);
    else if (k==='jinrai' && (n===1||n===2)) await fxJinrai(n);
    else if (k==='hush' && (n===1||n===2)) await fxHush(n, extra||'');
    else if (k==='crown' && n>=0 && n<N) await fxCrown(n);
    else if (k==='decree' && n>=0 && n<N) await fxDecree(n);
    else if (k==='regicide' && (n===1||n===2)) await fxRegicide(n);
    else if (k==='coronation' && (n===1||n===2)) await fxCoronation(n);
    else if (k==='trap' && n>=0 && n<64) await fxTrap(n, +extra===2?2:1);
    else if (k==='rage' && (n===1||n===2)) await fxRage(n);
    else if (k==='wrath' && n>=0 && n<64) await fxWrath(n, extra||'');
    else if (k==='foresee' && n>=0 && n<64) await fxForesee(n);
    else if (k==='quake' && n>=0 && n<N) await fxQuake(n, extra||'');
    else if (k==='gouketsu' && n>=0 && n<N) await fxGouketsu(n, extra||'');
    else if (k==='rust' && n>=0 && n<N) await fxRust(n);
  }
}

/* ---------- CPU ---------- */
function cpuCardChoice(p){
  if (!cardAllowed(p)) return null;
  if (cfg.lv==1 && Math.random()<.5) return null;
  const el=cfg.el[p], opp=3-p, e=emptyCount();
  if (el==='light'||el==='dark'||el==='star'){
    if (e<=14 || Math.random()<.35) return {};
  } else if (el==='fire'){
    const om=legal(board,opp), corner=om.find(isCorner);
    if (corner!==undefined) return {target:corner};
    if (om.length && Math.random()<.2){ const best=om.slice().sort((x,y)=>W8(y)-W8(x))[0]; if (W8(best)>=15 && best<64) return {target:best}; }
  } else if (el==='king'){
    if (Math.random()<.6) return {};
  } else if (el==='rock'){
    if (Math.random()<.3) return {};
  } else if (el==='ninja'){
    const opp2=3-p, own=[], theirs=[];
    for (let i=0;i<64;i++){ if (board[i]===p) own.push(i); else if (board[i]===opp2 && !prot.some(g=>g.idx===i && g.owner===opp2)) theirs.push(i); }
    if (own.length && theirs.length){
      const a=own.sort((x,y)=>W8(x)-W8(y))[0], b=theirs.sort((x,y)=>W8(y)-W8(x))[0];
      if (W8(b)-W8(a)>=25) return {target:[a,b]};
    }
  } else if (el==='dragon'){
    let best=null, bs=2;
    for (let i=0;i<64;i++) for (const d of [[0,1],[1,0],[1,1],[1,-1]]){
      const [r,c]=RC[i]; if (r-d[0]>=0&&r-d[0]<8&&c-d[1]>=0&&c-d[1]<8) continue;
      const line=[]; for (let rr=r,cc=c; rr>=0&&rr<8&&cc>=0&&cc<8; rr+=d[0],cc+=d[1]) line.push(rr*8+cc);
      if (line.length<3) continue;
      let sc=0; for (const k of line){ if (prot.some(g=>g.idx===k && g.owner===board[k])) continue; if (board[k]===3-p) sc+=1+(isCorner(k)?3:0); else if (board[k]===p) sc-=1+(isCorner(k)?3:0); }
      if (sc>bs){ bs=sc; best=line; }
    }
    if (best && (bs>=4 || Math.random()<.4)) return {target:best};
  } else if (el==='oni'){
    const {best,n}=oniBest(board,p,prot);
    if (best>=0 && (n>=4 || e<=14 || Math.random()<.3)) return {target:best};
  } else if (el==='steel'){
    const pool=steelPick(p).sort((a,b)=>W8(b)-W8(a)), t=pool.slice(0,Math.min(STEEL_N,pool.length));
    if (t.length>=2 && (t.some(isCorner) || e<=14 || Math.random()<.3)) return {target:t};
  } else if (el==='time'){
    if (lastPlace && lastPlace.p===3-p){ let d=0; for (let i=0;i<64;i++) if (board[i]!==lastPlace.before[i]) d++; if (isCorner(lastPlace.idx) || d>=4 || Math.random()<.3) return {}; }
  } else {
    if (legal(board,p).some(isCorner) || Math.random()<.4) return {};
  }
  return null;
}
function maybeCPU(){
  if (phase!=='play'||over||busy||aim) return;
  const cs=cpuSide(); if (!cs) return;
  const myGen=gen;
  if (decree){
    if (decree.by===cs) setTimeout(()=>{ if (myGen===gen && decree && decree.by===cs && !busy) decreeChoose(decree.opts.slice().sort((a,b)=>W8(a)-W8(b))[0]); }, 800);
    return;

    if (myGen!==gen||phase!=='play'||over||busy||decree||turn!==cs) return;

    const ill=illusionMoves(p);
    if (ill.length && Math.random()<.3){ springTrap(pick(ill)); return; }
    const c=cpuCardChoice(p);
